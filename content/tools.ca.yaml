core_layers:
  - id: geo
    title: "Metadades geoespacials i d'edificis"
    text: "Identitat i empremta de l'edifici, ús, antiguitat, alçada, sistemes, sistema de referència de coordenades, enllaços amb el cadastre i dades obertes d'edificis."
  - id: socio
    title: "Estructura socioeconòmica"
    text: "Llars, propietat i pertinença, vulnerabilitat, tarifes i costos, descrits amb els mateixos camps i codis."
  - id: capture
    title: "Captura de dades i procedència"
    text: "Què es recull, com, qui i quan. Cada valor indica si és mesurat, modelat o declarat, i d'on ve."
  - id: cases
    title: "Fitxes de casos reals"
    text: "Un registre estàndard per a l'estudi d'una comunitat o districte, perquè projectes diferents es puguin comparar en igualtat de condicions."
  - id: kpis
    title: "Indicadors clau"
    text: "Definicions, fórmules, unitats i límits acordats, perquè els números de eines diferents signifiquin el mateix."
