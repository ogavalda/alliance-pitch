hero:
  kicker: "Proposta preliminar · preparada per a l'IREC"
irec_ask:
  kicker: "Què hi guanya l'IREC, i la petició"
  title: "Un inici contingut, amb accés a finançament, iguals i casos reals a l'altra banda de l'Atlàntic."
  lead: "L'IREC s'hi sumaria amb un primer compromís petit, espai i suport tècnic, mentre Concordia assumeix el sou del primer any. A canvi guanya un abast difícil de construir en solitari."
  start_title: "Un inici amb poc requeriments"
  start_text: "Com es cobreixen els dos primers anys, segons el pressupost."
  start_cards:
    - {title: "Concordia assumeix el sou", text: "El director o directora de l'aliança és pagat per Concordia en espècie: {c27} EUR el {y0} i {c28} EUR el {y1}."}
    - {title: "L'IREC aporta espai i suport tècnic", text: "Lloguer en espècie de {i27} EUR el {y0} i {i28} EUR el {y1}, més suport tècnic (hores per acordar). Són el {p27}% i el {p28}% dels costos."}
    - {title: "Cap compromís en efectiu els primers anys", text: "Les aportacions dels socis comencen el {y1} ({pc28} EUR en total entre tots els socis). La part de l'IREC s'ha d'acordar i podria continuar en espècie."}
  benefits_title: "Què hi guanya l'IREC"
  benefits:
    - title: "Més línies de finançament"
      text: "Concordia i els socis nord-americans poden arribar a fundacions filantròpiques (per exemple Rockefeller o Schmidt) i a organismes internacionals (ONU-Hàbitat, OCDE); la proposta d'Annex ja cita ONU-Hàbitat i l'OCDE com a col·laboradors proposats. L'accés mitjançant l'Aliança és el nostre coneixement, per confirmar; no hi ha cap compromís. El pressupost apunta a projectes de recerca bilaterals ({bil} EUR en el període), un projecte Horizon ({hor} EUR) i convocatòries multilaterals com IEA, Banc Mundial i ONU ({mul} EUR). El Canadà i Espanya també han obert convocatòries bilaterals EUREKA via NRC-IRAP i CDTI (2020 i 2022; no n'hem trobat d'obertes per al 2025-2026)."
    - title: "Centres aliats que construeixen eines semblants"
      text: "Conversa directa amb equips les eines dels quals són més avançades en aspectes concrets: Tools4Cities (marc de codi obert de bessons digitals de ciutat amb API REST), REScoopVPP (passarel·la domèstica i núvol comunitari de codi obert per a la flexibilitat) i MAKING-PEDs (bessons digitals, amb el Prat de Llobregat com a banc de proves). L'IREC hi aporta les seves eines comunitàries (comunitatenergetica.cat, SomComunitatEnergetica.cat). Una estructura de dades compartida facilitaria molt l'intercanvi de mètodes i la integració d'eines."
    - title: "Casos d'ús en altres llocs"
      text: "Provar i validar els mètodes de l'IREC en casos d'altres llocs: el Gran Montreal (avaluació solar, geotèrmica i de calor residual), el laboratori viu Carré Laval, la xarxa de districte de Toronto, comunitats indígenes a la Colúmbia Britànica i Alberta; i a Espanya i Europa, Osona (27 comunitats en desenvolupament), Guipúscoa (60 en funcionament) i La Bordeta a Barcelona. Fitxes de casos comparables converteixen cadascun en evidència. Mitjançant Azimut 360 i Aiguasol, es podrien afegir casos de l'Àfrica subsahariana (microxarxes rurals) per provar els mètodes en entorns aïllats de xarxa."
    - title: "Ponts per a Catalunya"
      text: "Catalunya i el Quebec tenen un acord de cooperació des de 1996 (30 anys el 2026), amb un comitè mixt que fixa un programa de treball cada dos anys; el clima s'hi va afegir el 2010 i la recerca i la innovació, inclosa l'energia neta, són prioritats. Idea per explorar: demanar que les comunitats energètiques i els bessons digitals es reflecteixin en el proper programa. Més enllà, un eix Canadà-Espanya-Europa connecta l'IREC amb REScoop.eu, Energy Cities i la via de l'IEA."
  we_ask_title: "Què demanem a l'IREC"
  we_ask:
    - "Espai de treball a Barcelona per a l'equip de l'aliança (en espècie, com al pressupost)."
    - "Un contacte tècnic i una quantitat acordada i limitada de suport tècnic."
    - "Un lloc al grup fundador: un seient a la junta i al comitè tècnic."
    - "Preparar junts una convocatòria durant el primer any."
    - "Una primera revisió, amb les eines pròpies de l'IREC, de l'estructura de dades compartida."
  could_ask_title: "Què podria demanar l'IREC"
  could_ask:
    - "Regles clares de propietat intel·lectual i d'intercanvi de dades; les eines de l'IREC mantenen la seva identitat."
    - "Un límit de temps i de suport tècnic, amb un punt de revisió després del primer any."
    - "Com es reparteixen les aportacions dels socis a partir del segon any, i l'opció de contribuir en espècie."
    - "Una clàusula de sortida i sense exclusivitat."
  questions_title: "Quatre preguntes per a l'IREC"
  questions:
    - {tag: "Valor", title: "Quin dels quatre beneficis importa més a l'IREC?", text: "Línies de finançament, iguals, casos d'ús o el pont Catalunya-Quebec? Quin descartaríeu?"}
    - {tag: "Suport", title: "Què podria oferir realment l'IREC?", text: "Espai, hores tècniques, dades, un lloc per a investigadors visitants?"}
    - {tag: "Decisió", title: "Qui a l'IREC hauria de ser el contacte i decidir?", text: "I quina aprovació necessitaria un primer compromís?"}
    - {tag: "Adopció", title: "Què impediria que l'IREC s'hi sumés?", text: "Recursos, propietat intel·lectual, prioritats, competència amb serveis propis? Digueu-nos com hauria de ser el primer pas."}
  note: "Les xifres surten del pressupost. L'accés a fundacions i la idea Catalunya-Quebec no són compromisos; són vies per explorar junts."
