# The documents this repository builds. Each edition = a main pitch plus an annex.
# acts: three groups of main chapters (storytelling parts); annex: template names from src/templates/sections/ (order = order on the page; main chapters are numbered 01, 02...; annex A, B...)
# overlays: text files merged on top of text.yaml, in order (language and audience changes)
# set enabled: false to skip an edition.
editions:
  - id: generic
    lang: en
    output: index.html            # generic document, any entity
    overlays: []
    acts: [[problem, why, landscape_summary], [alliance, facilitation, ebc_summary, members_summary, govern], [roadmap, budget_summary, ask]]
    annex: [ebc_annex, facilitation_detail, landscape, form, members, services, budget, status]
  - id: irec_en
    lang: en
    output: irec_en.html          # document for IREC, English
    overlays: [text.irec.en.yaml]
    acts: [[problem, why, landscape_summary], [alliance, facilitation, ebc_summary, members_summary, govern], [roadmap, budget_summary, irec_ask]]
    annex: [ebc_annex, facilitation_detail, landscape, form, members, services, budget, status]
  - id: irec_ca
    lang: ca
    output: irec_ca.html          # document for IREC, Catalan
    overlays: [text.ca.yaml, text.irec.ca.yaml]
    acts: [[problem, why, landscape_summary], [alliance, facilitation, ebc_summary, members_summary, govern], [roadmap, budget_summary, irec_ask]]
    annex: [ebc_annex, facilitation_detail, landscape, form, members, services, budget, status]
