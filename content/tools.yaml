# The proposed shared core: what would be developed once and shared by all.
core_layers:
  - id: geo
    title: "Geospatial and building metadata"
    text: "Building identity and footprint, use, age, height, systems, coordinate reference, links to cadastre and open building datasets."
  - id: socio
    title: "Socioeconomic structure"
    text: "Households, ownership and membership, vulnerability, tariffs and costs, described with the same fields and codes."
  - id: capture
    title: "Data capture and provenance"
    text: "What is collected, how, by whom and when. Each value says if it was measured, modelled or declared, and where it came from."
  - id: cases
    title: "Real-case records"
    text: "A standard record for a community or district case study so that different projects can be compared like with like."
  - id: kpis
    title: "Key indicators"
    text: "Agreed definitions, formulas, units and boundaries for the indicators, so numbers from different tools mean the same thing."
