# Tool landscape for community and local energy management. One entry per tool or tool family.
# Fields left empty (null) are shown as "?" = not confirmed in the public sources we found. Please complete them.
# diagram: true  -> the tool appears as a column in the stack diagram (keep it to 6 or 7).
columns:
  frontend: "Front end"
  backend: "Back end"
  data_model: "Data model"
  capture: "Data capture"
  kpis: "Key indicators"
  openness: "Openness"

# How the map classifies tools (edit freely):
#   topic = row, scale = [first, last] column it covers, who = owner type (colour), geo = where it comes from (colour)
map:
  topics:
    planning:     "Planning and simulation"
    operation:    "Operation and flexibility"
    sharing:      "Energy sharing, virtual metering and local trading"
    flexibility:  "Aggregation and flexibility (peak shaving, demand shifting)"
    monitoring:   "Monitoring and benchmarking across communities"
    setup:        "Community set-up and administration"
    knowledge:    "Data, indicators and knowledge"
    unclassified: "Not yet classified"
  scales:
    1: "Building and household"
    2: "Energy community"
    3: "District and neighbourhood"
    4: "City and region"
  who:
    research:  {label: "Research and universities", colour: "#93002d"}
    eu:        {label: "EU and public bodies (projects)", colour: "#00776f"}
    public:    {label: "Regional and national public bodies", colour: "#1598d6"}
    network:   {label: "Networks and cooperatives", colour: "#e83f21"}
    company:   {label: "Companies", colour: "#e08a00"}
    programme: {label: "International programmes and inventories", colour: "#7a4fa0"}
  geo:
    canada:  {label: "Canada", colour: "#e83f21"}
    spain:   {label: "Spain / Catalonia", colour: "#e90065"}
    europe:  {label: "Europe", colour: "#1598d6"}
    global:  {label: "Global / international", colour: "#7a4fa0"}
    unknown: {label: "Not confirmed", colour: "#8a8f93"}

