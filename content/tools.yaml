  kpis: "Key indicators"
  openness: "Openness"

# How the map classifies tools (edit freely):
#   topic = row, scale = [first, last] column it covers, who = owner type (colour), geo = where it comes from (colour)
map:
  topics:
    planning:     "Planning and simulation"
    operation:    "Operation and flexibility"
    setup:        "Community set-up and administration"
    knowledge:    "Data, indicators and knowledge"
    unclassified: "Not yet classified"
  scales:
    1: "Building and household"
    2: "Energy community"
    3: "District and neighbourhood"
    4: "City and region"
  who:
    research:  {label: "Research and universities", colour: "#93002d"}
    eu:        {label: "EU and public bodies (projects)", colour: "#00776f"}
    public:    {label: "Regional and national public bodies", colour: "#1598d6"}
    network:   {label: "Networks and cooperatives", colour: "#e83f21"}
    company:   {label: "Companies", colour: "#e08a00"}
    programme: {label: "International programmes and inventories", colour: "#7a4fa0"}
  geo:
