  kicker: "Pressupost previst"
  title: "Un inici lleuger que creix amb la feina."
  lead: "Un equip petit finançat primer amb contribucions en espècie, després amb aportacions dels socis i ingressos de projectes. Imports en EUR."
  stats:
    total_costs: "Costos totals"
    first_year: "Costos del primer any (any parcial)"
    partners_share: "Part coberta per aportacions dels socis"
    projects_share: "Part de projectes de recerca i multilaterals"
    team_2033: "Equip el darrer any"
  team_unit: "persones"
  note: "Xifres previstes. Els gràfics i la taula completa són a l'annex."
govern:
  kicker: "Com funciona"
  title: "Neutral per disseny, perquè els competidors puguin seure a la mateixa taula."
  columns:
    - title: "Una carta breu"
      items: ["Obert per defecte pel que fa al nucli compartit", "Els membres conserven la seva feina pròpia", "Cap servei que competeixi amb els membres", "Orientació de dret de la competència a totes les reunions"]
    - title: "Òrgans equilibrats"
      items: ["Assemblea de tots els membres", "Junta equilibrada entre les sis famílies de membres", "Comitè tècnic per al comú", "Panell d'experts per liderar els processos facilitats", "Secretaria petita"]
    - title: "Joc net en projectes"
      items: ["Els rols de lideratge roten amb criteris clars", "L'Aliança facilita, mai tria guanyadors", "Una part dels projectes guanyats torna al comú (si els finançadors ho permeten)"]
  note: "La forma jurídica no ha de bloquejar l'inici: el capítol següent proposa un pla B que comença ja, amb un acord de col·laboració i una petita associació catalana, mentre es treballa una entitat internacional sense ànim de lucre."
roadmap:
  kicker: "Llarg termini"
  title: "De la primera prova a un organisme de referència."
  phases:
