      style: ex
      items: ["Ontologies obertes i eines de modelització on construir [extern]", "Finançament de la UE per a instal·lacions comunitàries i per a bessons de xarxa [extern]", "Annexos de l'IEA EBC sobre comunitats i edificis basats en dades [extern]", "Proposta de nou Annex (tasca) presentada a l'ExCo a principis d'octubre de 2026, amb el suport de NRCan", "Trajectòria en facilitació: calefacció urbana a Laval i Concordia, ABC Accelerator (Montréal, des del 2022); CÔTÉ Habitat en desenvolupament", "Converses amb socis: [?] llista"]
