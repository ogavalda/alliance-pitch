ebc_annex:
  kicker: "La proposta d'Annex de l'IEA EBC"
  title: "L'Annex és el primer motor: de «pot funcionar?» a «qui ho farà funcionar?»"
  lead: "Títol proposat: <em>Enabling implementation of Community Energy Solutions through digital platforms</em>. El concepte es va presentar al Comitè Executiu de l'IEA EBC a principis d'octubre de 2026, amb el suport de NRCan. Líder i Operating Agent proposada: Ursula Eicker (Universitat Concordia)."
  problem_title: "El problema que aborda"
  problem_text: "Els sistemes energètics a escala comunitària (comunitats energètiques solars fotovoltaiques, calefacció i refrigeració urbanes, districtes i campus amb energies mixtes) són tècnicament madurs, però l'adopció és lenta. Els estudis de viabilitat responen «pot funcionar?» però rarament «qui ho farà funcionar?», i per això projectes sòlids s'encallen entre la planificació i la implementació. L'Annex fa servir bessons digitals per a una avaluació tècnica i financera ràpida i tracta la governança, la participació, la propietat, el finançament i la regulació com a part del model."
  objectives_title: "Sis objectius"
  objectives:
    - {title: "Estructures de governança", text: "Identificar rols d'actors, estructures de propietat i d'operació, implicació de les empreses elèctriques, participació i repartiment del risc que funcionen."}
    - {title: "La bretxa d'implementació", text: "Saber per què projectes viables no avancen, i construir marcs per a barreres institucionals, coordinació, contractació i acceptació."}
    - {title: "Finançament", text: "Models de negoci, aliances publicoprivades i amb empreses elèctriques, propietat comunitària i repartiment del risc."}
    - {title: "Regulació", text: "Comparar els marcs de xarxes de calor i fred, comunitats energètiques, compartició d'electricitat, tarifes, disseny d'edificis i zonificació."}
    - {title: "Eines de planificació digitals", text: "Aplicar i escalar eines de codi obert basades en bessons digitals per a simulació de la demanda, cartografia energètica comunitària, selecció de tecnologies i cost de cicle de vida, amb les restriccions regulatòries, financeres i de governança incorporades."}
    - {title: "Fulls de ruta d'implementació", text: "Guia pas a pas per a ajuntaments, promotors i organitzacions ciutadanes, de l'estudi de viabilitat a l'operació."}
  outputs_title: "Resultats"
  outputs: "Un marc de governança i actors, un marc de participació i cocreació, una guia de finançament i models de negoci, una avaluació regulatòria, fulls de ruta d'implementació, estudis de cas demostratius i recomanacions de polítiques, tot integrat en una plataforma digital que guia tot el procés de planificació."
  lineage_title: "Es basa en treballs anteriors de l'EBC"
  lineage: "Annex 51 (Energy Efficient Communities), Annex 63 (Implementation of Energy Strategies in Communities), Annex 73 (Net Zero Energy Resilient Public Communities), Annex 75 (Cost-effective Building Renovation at District Level) i Annex 83 (Positive Energy Districts). Cap d'ells no va combinar l'avaluació digital ràpida de viabilitat amb el problema organitzatiu de l'execució."
  plan_title: "Calendari i col·laboradors"
  plan_cards:
    - {title: "Durada", text: "Preparació 1 any, fase de treball 3 anys, informes 1 any. L'inici depèn de la decisió de l'ExCo."}
    - {title: "Coordinació", text: "Amb els programes de col·laboració tecnològica DHC, Cities, SHC, Energy Storage i Users (DSM)."}
    - {title: "Col·laboradors externs proposats", text: "Organitzacions municipals com FCM, el Global Covenant of Mayors, C40 i organitzacions de la Transition Accelerator, i organismes internacionals com ONU-Hàbitat i la divisió Cities, Urban Policies and Sustainable Development de l'OCDE."}
  link_title: "Com s'hi relaciona l'Aliança"
  link_text: "L'Annex el lideren els governs i té una durada limitada. L'Aliança seria la seva llar permanent i més àmplia: manté vius el nucli compartit, les eines i els socis quan l'Annex acabi, i deixa participar empreses i xarxes comunitàries, cosa que un Annex no pot fer."
  note: "Font: EBC Project Concept de 24 d'agost de 2026. Punt obert: encara no s'ha fet cap Technology Readiness Assessment; l'ExCo el demanaria al taller que desenvolupi la proposta completa."

ebc_summary:
  kicker: "El primer motor"
  title: "Un nou Annex de l'IEA EBC ja és sobre la taula, amb el suport de NRCan."
  lead: "A principis d'octubre de 2026 vam presentar al Comitè Executiu de l'IEA EBC una proposta de nou Annex: <em>Enabling implementation of Community Energy Solutions through digital platforms</em>. Mou la pregunta de «pot funcionar?» a «qui ho farà funcionar?», amb bessons digitals per a una viabilitat ràpida i afegint governança, finançament i regulació al model."
  cards:
    - {title: "Què fa", text: "Models de governança, finançament, regulació i eines de bessons digitals de codi obert, reunits en una plataforma que guia un projecte de la prefactibilitat a la implementació."}
    - {title: "Quant dura", text: "1 any de preparació, 3 de treball i 1 d'informes, si l'ExCo l'aprova (decisió prevista a la reunió de novembre de 2026)."}
    - {title: "Per què també una Aliança", text: "Un Annex el lideren els governs i s'acaba. L'Aliança manté vius el nucli compartit, les eines i els socis després, i deixa participar empreses i xarxes comunitàries."}
  note: "Líder i Operating Agent proposada: Ursula Eicker (Concordia). Entre els col·laboradors externs proposats hi ha FCM, el Global Covenant of Mayors, C40, ONU-Hàbitat i l'OCDE."

services:
  kicker: "Què ofereix l'Aliança més enllà dels seus membres"
  title: "Serveis que ajuden tothom i no competeixen amb ningú."
  lead: "El criteri és simple: l'Aliança fa el que cap membre té motiu per fer sol, i mai no lliura feina que un membre podria vendre. Tot allò que toqui el projecte d'un client, un emplaçament concret o un producte comercial queda fora."
  first_title: "Començar amb quatre"
  first:
    - {title: "Un llibre blanc", text: "Un estat anual de l'energia local i els bessons digitals: evidència entre projectes, com es defineixen els indicadors, un mapa d'eines i llacunes. Barat, construeix credibilitat i dona veu a l'Aliança."}
    - {title: "Estàndard de fitxa de cas i d'indicadors", text: "Un registre comú per a estudis de cas de comunitats i districtes, amb definicions d'indicadors acordades i càlculs de referència, perquè els casos es puguin comparar en igualtat de condicions."}
    - {title: "Oficina de propostes", text: "Vigila convocatòries, busca socis, ofereix plantilles de consorci i de justificació i una regla de rotació. No escriu ofertes ni tria guanyadors."}
    - {title: "Processos liderats i facilitats", text: "Un convocant neutral, amb un panell d'experts d'equips membres com a líders, dirigeix un procés amb molts actors al voltant d'un projecte o lloc concret: tallers, diagnòstic compartit, grups de treball, resultat documentat. Ja ho fem (vegeu el capítol de facilitació). Costa més esforç, així que comença amb uns quants processos pilot."}
  first_note: "Els tres primers són barats, mostren valor en un any, i cap no toca la feina pròpia d'un membre. La facilitació és l'activitat distintiva de l'Aliança i necessita un coordinador finançat."
  later_title: "Quan hi hagi confiança"
  later:
    - {title: "Avaluació comparativa i validació", text: "Executar els models dels membres amb conjunts de dades de prova compartits i publicar els resultats. Un àrbitre neutral, no un consultor."}
    - {title: "Suport a la contractació", text: "Clàusules de contracte model i una llista de verificació per a ciutats que compren bessons digitals, perquè els compradors puguin exigir interoperabilitat."}
  scope_title: "Dins i fora de l'abast"
  col_in: "Dins de l'abast: infraestructura i serveis neutrals"
  col_out: "Fora de l'abast: el que fan els membres"
  scope:
    - ["Convocar i facilitar processos amb molts actors al voltant d'un projecte concret", "Dissenyar el projecte, vendre enginyeria o tenir un rol en l'execució"]
    - ["Model de dades, ontologia i un validador que comprova la conformitat", "Plataformes o interfícies per gestionar una comunitat o atendre usuaris finals"]
    - ["Plantilla de fitxa de cas i una biblioteca oberta de casos", "Estudis o dissenys per a un client, emplaçament o projecte concret"]
    - ["Definicions d'indicadors amb càlculs de referència", "Algorismes o productes propis venuts a comunitats"]
    - ["Eina de mapatge que converteix les dades d'un membre a l'estructura compartida", "Operar les dades o la plataforma d'un membre"]
    - ["Llibres blancs, avaluacions comparatives, formació i fòrums", "Consultoria i redacció d'ofertes per a membres concrets"]
    - ["Contractes model i llistes de verificació de contractació", "Triar proveïdors o guanyadors"]
    - ["Allotjar conjunts de dades anonimitzats que els membres accepten compartir", "Competir amb els serveis propis dels membres"]
  paid_title: "Què es podria cobrar"
  paid_yes_title: "Serveis neutrals de pagament"
  paid_yes: ["Formació i cursos", "Participació en avaluacions comparatives", "Certificació segons el nucli compartit", "Coordinació d'un procés facilitat, a cost (per parlar-ne)"]
  paid_no_title: "No s'ofereix"
  paid_no: ["Res que s'assembli a consultoria"]
  note: "És una proposta nostra, oberta a debat. L'opinió dels membres sobre on és la frontera entre neutral i competidor és una de les qüestions que necessitem criticar."

facilitation:
  kicker: "Ja ho fem"
  title: "Reunir la gent a la taula, i portar-la fins a una decisió, és una cosa que ja fem."
  lead: "El nostre centre ha fet d'intermediari en dues iniciatives de calefacció urbana i ha impulsat dos projectes que reuneixen els actors d'un sector. En cada cas algú va haver de liderar i guiar el procés, o no hauria avançat. Ho volem convertir en una de les activitats essencials de l'Aliança, amb més socis i a més escala."
  cards:
    - {title: "Calefacció urbana a Laval i a Concordia", text: "Hem actuat d'intermediaris entre els socis, fent tallers i entenent els diferents problemes del veïnat."}
    - {title: "ABC Accelerator (Montréal, des del 2022)", text: "Un «equip SWAT de sostenibilitat» format per l'ajuntament, una empresa elèctrica, un banc, promotors, enginyeries, arquitectes, advocats i la universitat treballa en projectes reals. Dos pilots, més de 200 hores cadascun, un procés de tres mesos."}
    - {title: "CÔTÉ Habitat (Montréal)", text: "Un centre que reuneix una xarxa d'habitatge, una aliança de transició i Concordia al voltant de la transició de l'habitatge existent: acompanyament tècnic, social, urbanístic i financer en un sol procés. En desenvolupament, cercant una persona líder assalariada."}
    - {title: "Què hem après", text: "Una universitat com a convocant neutral genera confiança. Un projecte concret val més que un debat abstracte. Amb tota la cadena a la mateixa taula, les barreres esdevenen oportunitats. Sense lideratge i guia, l'intermediari perd el seu paper i tot s'atura. Calen tres o quatre mesos i un coordinador finançat."}
  panel_title: "L'Aliança lideraria, no només acolliria"
  panel_text: "Un panell d'experts de diferents equips membres actuaria com a líder i intermediari d'aquests processos, per donar suport a la transició cap als sistemes locals. L'Aliança no ofereix només la taula, sinó el lideratge de com s'apliquen els processos."
  note: "El mètode, les lliçons i la frontera amb allò que fan els membres són a l'annex."

facilitation_detail:
  kicker: "Facilitació: mètode i trajectòria"
  title: "Com dirigiria l'Aliança un procés facilitat."
  lead: "Els projectes d'energia local rarament fracassen perquè la tecnologia no funcioni. S'encallen perquè l'ajuntament, l'empresa elèctrica, el finançador, el promotor i el veïnat no han acordat mai junts qui fa què, i ningú no els porta fins a una decisió. Un convocant neutral amb lideratge tanca aquesta bretxa."
  record_title: "Trajectòria"
  record:
    - {title: "Calefacció urbana a Laval i a Concordia", text: "El nostre centre va fer d'intermediari entre els socis, va fer tallers i va entendre els diferents problemes del veïnat."}
    - {title: "ABC Accelerator", text: "Iniciat el 2022 dins del partenariat climàtic de Montréal. Un «equip SWAT de sostenibilitat» de set tipus d'actors: universitat, promotor, finançament, empresa elèctrica, enginyeria i arquitectura, dret i l'ajuntament. Primera prova amb dos promotors reals."}
    - {title: "CÔTÉ Habitat", text: "Un centre per a la transició ecològica de l'habitatge existent a Montréal, impulsat per una xarxa d'habitatge, una aliança de transició i Concordia. Acompanyament tècnic, social, urbanístic i financer en un sol procés; dos pilots previstos per provar les hipòtesis i els models de negoci."}
  abc_title: "L'ABC Accelerator en xifres"
  abc_stats:
    - {value: "7", label: "tipus d'actors a la mateixa taula"}
    - {value: "2", label: "projectes pilot amb promotors reals"}
    - {value: "200+", label: "hores d'experts per projecte, més unes 400 hores per construir eines reutilitzables"}
    - {value: "3 mesos", label: "per projecte, amb quatre documents finals"}
  abc_note: "Reduccions d'emissions estimades per als dos pilots: al voltant del 19% amb les propostes de base i del 33% amb les propostes de nova generació (estimacions del mateix projecte, no resultats mesurats)."
  panel_title: "Un panell d'experts que lidera"
  panel_lead: "La taula no n'hi ha prou: sense lideratge i guia l'intermediari perd el seu paper i res no avança. L'Aliança formaria un panell per aportar aquest lideratge. És una proposta, encara per dissenyar."
  panel:
    - {title: "Qui", text: "Experts dels diferents equips membres (tècnics, socials, financers, jurídics, urbanístics), equilibrats entre les famílies de membres."}
    - {title: "Què fan", text: "Lideren i guien un procés de transició local, mantenen intacte el paper d'intermediari i procuren que avanci cap a una decisió."}
    - {title: "Com s'assigna", text: "Un líder o equip per procés, amb rotació, i una regla clara quan un membre té interès comercial propi en el resultat."}
    - {title: "Què els dona suport", text: "Una secretaria petita, plantilles compartides i un coordinador finançat, perquè el lideratge no depengui del temps lliure."}
  method_title: "Un procés en sis passos"
  method:
    - {title: "Partir d'un projecte concret", text: "Un projecte o lloc real, no un tema abstracte."}
    - {title: "Convidar tota la cadena", text: "Ajuntament, empresa elèctrica, finançador, promotor, enginyeries i arquitectes, assessorament jurídic, i la comunitat o el veïnat."}
    - {title: "Acordar primer les regles", text: "Rols, confidencialitat, què es pot compartir, i una manera justa de seleccionar qui hi participa."}
    - {title: "Escoltar i cartografiar", text: "Tallers per entendre els problemes i les restriccions de cada part, i qui està més o menys obert al canvi."}
    - {title: "Treballar en comissions petites", text: "Per exemple espai públic, sistemes energètics, edificis i certificació, amb un plenari mensual."}
    - {title: "Documentar i retornar", text: "Un diagnòstic, propostes a dos nivells d'ambició, vies de finançament i recomanacions amb costos i impactes, més plantilles que altres puguin reutilitzar."}
  lessons_title: "Què hem après"
  lessons:
    - "Una universitat que actua com a agent central i neutral és molt ben vista i genera confiança."
    - "Les opcions innovadores fan menys por quan bancs, ajuntaments i actors clau les avalen de manera visible."
    - "Els exemples d'altres i una bona presentació acceleren les decisions."
    - "Els equips tècnics poden començar com la força conservadora. Reunió rere reunió, abordant les seves pors, es van tornar col·laboratius."
    - "Tres o quatre mesos de procés ajuden a suavitzar els primers dubtes."
    - "Les preocupacions de confidencialitat van primer: calia un acord de confidencialitat amb el convocant i acords paral·lels amb cada soci."
    - "Sense lideratge i guia l'intermediari perd el seu paper. A l'ABC Accelerator la universitat va coordinar cada pas; CÔTÉ preveu una persona líder assalariada."
    - "El temps d'experts gratuït no permet una dedicació profunda. La coordinació necessita finançament: CÔTÉ preveu una persona líder assalariada des del principi."
  scope_title: "La frontera amb allò que fan els membres"
  scope_in_title: "L'Aliança fa"
  scope_in: ["Liderar i guiar el procés amb un panell d'experts d'equips membres", "Convocar, fer tallers i facilitar", "Cartografiar problemes i acordar les regles", "Coordinar grups de treball i documentar el resultat", "Convertir el que s'aprèn en plantilles i eines obertes a tothom"]
  scope_out_title: "L'Aliança no fa"
  scope_out: ["Dissenyar el projecte ni vendre enginyeria", "Tenir un rol comercial en l'execució", "Triar proveïdors o guanyadors", "Substituir l'expertesa que els membres porten a la taula"]
  link_title: "Com es connecta amb la resta"
  link_text: "Cada procés genera un cas real per a l'estàndard de fitxa de cas, evidència per al llibre blanc i per a la feina de governança de l'Annex, i una cartera de projectes preparats per ser finançats."
  note: "Fonts: capítol en esborrany sobre l'ABC Accelerator (2024) i el two-pager de CÔTÉ Habitat. Les organitzacions sòcies no hi apareixen amb nom a propòsit. Els resultats són estimacions."

