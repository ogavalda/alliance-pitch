impact:
  kicker: "Què canvia per als usuaris finals i la societat"
  title: "De l'accés al coneixement a beneficis mesurables: factures més baixes, emissions evitades, comunitats que duren."
  lead: "L'Aliança no és un fi en si mateixa. La prova és què canvia per a les comunitats energètiques, les finestretes úniques i les ciutats que serveix, i per a la societat. És un escenari il·lustratiu per a {c_supported} comunitats donades suport al cap de cinc anys, amb un cas baix i un d'alt. Cada xifra és una hipòtesi que es pot comprovar, i cada fitxa en mesuraria el valor real respecte d'un cas de referència."
  cards:
    - {who: "Comunitats energètiques", title: "Sostenibilitat econòmica", text: "Cada comunitat amb suport estalvia als seus {c_members_comm} membres uns {c_saving_comm} EUR l'any (rang {l_saving_comm} a {h_saving_comm}). El suport de l'Aliança costa uns {c_cost_comm} EUR per comunitat, que els membres recuperen en uns {c_payback} mesos (rang {h_payback} a {l_payback})."}
    - {who: "Finestretes úniques", title: "Un inici més ràpid", text: "Les comunitats amb suport comencen a operar uns {c_months} mesos abans (rang {l_months} a {h_months}) gràcies al Kit d'inici compartit, els casos comparables i els processos liderats. El temps fins al primer resultat de viabilitat es registra en dies a cada fitxa."}
    - {who: "Ciutats", title: "Emissions locals, diners locals", text: "Uns {c_co2_comm} t de CO2 evitades per comunitat i any (rang {l_co2_comm} a {h_co2_comm}). Una ciutat amb {city_n} comunitats amb suport n'obté uns {c_city_co2} t l'any, i l'estalvi es queda a les llars locals."}
    - {who: "Societat", title: "Escala i equitat", text: "{c_members} persones com a membres, uns {c_saving} M EUR l'any d'estalvi i {c_prod} GWh de producció local, que eviten uns {c_co2} t de CO2 l'any (rang {l_co2} a {h_co2}). La inclusió es mesura a cada fitxa, no se suposa."}
  kpis:
    - {value: "{c_ratio}×", label: "estalvi anual dels membres per cada euro que costa l'Aliança en {cost_years} anys (central; {l_ratio} a {h_ratio})"}
    - {value: "{c_saving_attr} M EUR", label: "estalvi guanyat per començar abans, un sol cop (central; {l_saving_attr} a {h_saving_attr} M)"}
    - {value: "{c_co2_attr} t", label: "CO2 evitat per començar abans, un sol cop (central; {l_co2_attr} a {h_co2_attr} t)"}
  table_title: "Tres casos"
  cols: ["", "Baix", "Central", "Alt"]
  labels:
    members: "Persones com a membres de les comunitats amb suport"
    saving: "Estalvi dels membres per any (EUR)"
    prod_gwh: "Producció local per any (GWh)"
    co2: "CO2 evitat per any (tones)"
    saving_attr: "Estalvi guanyat per començar abans (EUR, un sol cop)"
    co2_attr: "CO2 evitat per començar abans (tones, un sol cop)"
    payback_months: "Mesos perquè els membres recuperin el cost del suport"
    ratio: "Estalvi anual dels membres per euro de cost de l'Aliança (brut)"
    ratio_attr: "Igual, comptant només l'efecte de començar abans"
  note: "Escenari il·lustratiu basat en hipòtesis. Els casos difereixen en la mida de la comunitat, l'estalvi per membre i el factor d'emissió de la xarxa. Els beneficis bruts no són tots atribuïbles a l'Aliança: les files marcades com a únic compten només l'efecte de començar abans. Les hipòtesis i les fonts són a l'annex."

impact_detail:
  kicker: "Escenari d'impacte: hipòtesis i evidència"
  title: "Com es construeixen les xifres d'impacte, i com les dades reals les substituirien."
  lead: "Totes les xifres de la pàgina d'impacte es calculen a partir de les hipòtesis següents i del pressupost de l'Aliança (els primers {cost_years} anys costen {cost} EUR). Si canvies una hipòtesi, els resultats la segueixen. El mateix model està disponible com a full de càlcul."
  assump_title: "Hipòtesis"
  cols: ["Hipòtesi", "Baix", "Central", "Alt", "Base"]
  labels:
    supported: "Comunitats amb suport de l'Aliança en cinc anys"
    members: "Membres per comunitat"
    kw: "Potència solar instal·lada per comunitat (kW)"
    yield_kwh_kw: "Rendiment anual (kWh per kW)"
    saving_eur_member: "Estalvi per membre (EUR l'any)"
    ef_kg_kwh: "Factor d'emissió de la xarxa (kg CO2 per kWh)"
    months_earlier: "Mesos abans d'entrar en operació"
  basis:
    supported: "Hipòtesi: un subconjunt de les 500 comunitats del mapa. El programa d'inici canadenc sol ja en proposa 15 a 16."
    members: "Hipòtesi entre uns 200 membres per cooperativa a Alemanya i als Països Baixos (anàlisi de mercat) i 844 de mitjana en un mapatge acadèmic d'unes 4.000 comunitats de la UE."
    kw: "Hipòtesi. Els projectes espanyols amb suport fan de mitjana uns 0,7 MW (previstos); a Itàlia gairebé la meitat de les configuracions comunitàries són de 10 kW o menys."
    yield_kwh_kw: "Ordre de magnitud típic per al sud del Canadà i el centre d'Europa; es substituiria pel rendiment mesurat."
    saving_eur_member: "Basat en reduccions de factura modelades del 3,8% (repartiment d'energia) al 9,3% (solar col·lectiva) en 39 països europeus, menors quan els membres paguen els peatges de xarxa, i en estimacions de la Comissió Europea de 260 a 550 EUR l'any per a llars individuals amb solar (no resultats de comunitats)."
    ef_kg_kwh: "Il·lustratiu. Va de gairebé zero en xarxes hidràuliques a més de 0,4 on s'usa carbó. Cada fitxa usaria el seu factor local."
    months_earlier: "De l'escenari de l'anàlisi de mercat (2, 6 i 10 mesos, basat en hipòtesis). Cap estudi mesura el temps que estalvien les eines compartides o un intermediari; els pilots de l'Annex el mesurarien."
  formulas_title: "Com es calcula"
  formulas:
    - "Estalvi = comunitats amb suport × membres × estalvi per membre."
    - "Producció = comunitats amb suport × kW × rendiment. CO2 evitat = producció × factor d'emissió de la xarxa."
    - "Atribuïble (un sol cop) = benefici anual × mesos abans ÷ 12: la part deguda a començar abans."
    - "Cost = els primers {cost_years} anys del pressupost de l'Aliança; retorn = cost per comunitat ÷ estalvi per comunitat."
  measure_title: "Què substituiria les hipòtesis"
  measure:
    - {title: "Fitxa contra un cas de referència", text: "Cada comunitat informa de consum, producció, cost, model de negoci, clients i governança, i de la diferència amb el seu cas de referència."}
    - {title: "Indicadors comuns", text: "Indicadors d'energia, econòmics, socials i ambientals, amb la qualitat de les dades indicada com a mesurada, modelada o declarada."}
    - {title: "Un informe d'impacte anual", text: "L'Aliança publicaria estalvis, emissions i inclusió mesurats de totes les comunitats amb suport, i compararia els casos amb suport amb els que no en tenen."}
  caveats_title: "Límits a tenir presents"
  caveats:
    - "Els beneficis bruts no són tots mèrit de l'Aliança: algunes comunitats existirien igualment. Només se li atribueix l'inici anticipat."
    - "L'estalvi depèn dels peatges, impostos i tarifes, que canvien per país i província."
    - "Les xifres de carboni usen un factor de xarxa il·lustratiu, i el benefici és menor on la xarxa ja és neta."
    - "Els beneficis socials (inclusió, pobresa energètica, capacitats, llocs de treball locals) es mesuren a la fitxa però aquí no tenen valor monetari."
  sources_title: "Fonts"
  sources:
    - "Energy sharing in European renewable energy communities: impact of taxes, charges, fees and levies, Energy (2023), Politecnico di Torino; estalvis modelats del 3,8% i el 9,3%."
    - "Comissió Europea, pàgines de comunitats energètiques: estimacions d'estalvi per a llars amb solar."
    - "Mapatge de comunitats energètiques a la UE (estudi universitari): unes 4.000 comunitats i 900.000 membres."
    - "pv magazine (2026), comunitats energètiques italianes arriben a 303 MW; MITECO (2026) i Redeia (2026) per a Espanya."
    - "Anàlisi de mercat, Aliança Internacional d'Energia Comunitària (2026): escenari de temps estalviat i mides de cooperatives."

legal:
  kicker: "Per començar"
  title: "Una llar jurídica que no bloquegi l'inici: el pla B en paral·lel al pla A."
  lead: "Crear un organisme internacional amb els advocats de diverses institucions porta temps. Així que l'Aliança començaria per dues vies alhora: un acord de col·laboració breu i una petita associació que es pot crear aviat, a Catalunya o al Canadà (per decidir), mentre es treballa la forma internacional."
  steps:
    - {tag: "Pas 1 · setmanes", title: "Acord de col·laboració", text: "Els socis fundadors signen un acord breu: carta, comitè de direcció, un soci amfitrió que tingui el pressupost i contracti la direcció (com al pressupost, amb Concordia en espècie), i regles de dades i propietat intel·lectual. Cap entitat jurídica nova, fàcil de revertir, i els advocats llegeixen un sol text breu."}
    - {tag: "Pla B · de setmanes a uns mesos", title: "Una petita associació, a Catalunya o al Canadà", text: "Deixem obert on es crea. A Catalunya, almenys tres fundadors, persones o organitzacions, constitueixen una associació: acta fundacional i estatuts, i inscripció a la Generalitat, que resol en un màxim de tres mesos si es compleixen els requisits. Al Canadà, les opcions són una corporació federal sense ànim de lucre (Corporations Canada) o una entitat sense ànim de lucre del Quebec, en tots dos casos amb un consell d'almenys tres administradors. L'elecció depèn d'on siguin el primer finançament i l'amfitrió: alguns fons canadencs poden exigir una entitat canadenca, i alguns fons europeus una d'europea. Les institucions grans s'hi afegeixen com a membres quan tinguin les seves aprovacions. Mentre l'associació no existeixi, els membres en podrien respondre personalment, per això el pas 1 va primer."}
    - {tag: "Pla A · quan es justifiqui", title: "Una entitat internacional sense ànim de lucre", text: "Quan els membres i el finançament ho justifiquin, es passa a una entitat internacional sense ànim de lucre, amb l'associació del pla B com a membre fundador. La forma jurídica, la seu i el calendari es decideixen amb els advocats de les institucions fundadores."}
  table_title: "Les opcions"
  cols: ["Opció", "Rapidesa", "Qui ha d'aprovar", "Pot tenir diners i personal", "Límit principal"]
  rows:
    - ["Acord de col·laboració amb un amfitrió", "Setmanes", "El signant de cada soci", "Mitjançant el soci amfitrió", "L'amfitrió assumeix el risc financer; no és una entitat jurídica pròpia"]
    - ["Associació a Catalunya (pla B)", "Fins a uns 3 mesos d'inscripció", "Només els fundadors (tres o més)", "Sí, un cop inscrita", "Dret català i espanyol; més fàcil per a fons europeus, els fons canadencs poden exigir una entitat canadenca"]
    - ["Entitat sense ànim de lucre al Canadà (pla B)", "Per comprovar", "Fundadors i un consell d'almenys tres administradors", "Sí, un cop constituïda", "Normes federals o del Quebec (residència i terminis per verificar); més fàcil per a fons canadencs, els europeus poden exigir una entitat europea"]
    - ["Entitat internacional sense ànim de lucre (pla A)", "Molts mesos", "Advocats i consells de totes les entitats fundadores", "Sí", "Lenta i cara; formalitats al país escollit"]
  actions_title: "Què pot començar ja, sense esperar"
  actions:
    - "Signar l'acord de col·laboració i designar el soci amfitrió."
    - "Obrir una llista de signants fundadors i recollir cartes d'intenció."
    - "Decidir on es crea l'associació (Catalunya o Canadà), segons on siguin el primer finançament i l'amfitrió."
    - "Fer el primer comitè de direcció i publicar la carta."
  note: "Segons el nostre coneixement de fonts públiques (tràmit de la Generalitat de Catalunya per inscriure associacions; Corporations Canada per a entitats federals sense ànim de lucre). Els detalls del Canadà i del Quebec, els terminis i les normes de residència encara no s'han comprovat. Tot s'ha de confirmar amb un advocat a cada lloc abans de signar res."

europe:
  kicker: Aprendre de les organitzacions de suport europees
  title: Les organitzacions de suport europees ja mostren quins blocs de construcció falten.
  lead: 'A Europa han crescut dos tipus d''organització de suport: les finestretes úniques per a la rehabilitació d''edificis i les organitzacions paraigua per a comunitats energètiques. Totes dues busquen ara els blocs de construcció que oferiria l''Aliança.'
  cards:
  - {who: Finestretes úniques, title: Passen a ser obligatòries, text: 'La Directiva refosa de eficiència energètica d''edificis (UE) 2024/1275 exigeix almenys una finestreta única per cada 80.000 habitants, per regió, o a menys de 90 minuts de trajecte mitjà; el termini de transposició era el 29 de maig de 2026. La Recomanació (UE) 2026/536 dona prioritat a les llars vulnerables. La pràctica madura: EU Peers (LIFE, fins al 2029) i GiDomus a Girona (104 habitatges a Banyoles).'}
  - {who: Paraigües, title: 'Moltes comunitats, un sol marc', text: 'SOSS4EREC (LIFE, iniciat l''octubre de 2026) treballa amb quatre paraigües molt diferents que donen suport a 175 comunitats energètiques, unes 700 al conjunt del consorci, i cocrea un catàleg de 34 serveis (25 tècnics, 5 socials, 4 de governança) per a cinc tipus de projecte. La seva debilitat comuna és trobar l''enfocament adequat i ser financerament sostenibles.'}
  - {who: On es troben, title: Rehabilitació i comunitats energètiques convergeixen, text: 'La iniciativa europea de rehabilitació liderada per la ciutadania ajuda les comunitats energètiques a organitzar la rehabilitació per als seus membres i creix amb una xarxa d''11 organitzacions. Dins seu, COLOUR (Fundació Europace, OECOOP, IREC) ofereix un camí de cinc passos, des d''explorar l''oportunitat fins a verificar les obres.'}
  implications_title: Què significa per a l'Aliança
  implications:
  - {title: Construir els blocs una sola vegada, text: 'Totes dues organitzacions necessiten dades d''edificis i projectes, paquets de finançament, plantilles legals, mètodes de participació i seguiment de la qualitat.'}
  - {title: Abaratir els serveis, text: 'El seu punt més feble és la sostenibilitat financera, no les idees. Eines compartides, plantilles i serveis mancomunats redueixen el cost de cada servei.'}
  - {title: Mantenir el catàleg modular, text: 'Difereixen en forma jurídica i maduresa, així que cada organització adopta el que encaixa amb la seva etapa.'}
  - {title: Tractar la rehabilitació com a energia comunitària, text: 'L''Aliança connecta les finestretes úniques amb els paraigües de comunitats energètiques, a Europa i al Canadà, on les estructures comparables encara estan sorgint.'}
  note: El text complet, els projectes i els enllaços són a l'annex.
europe_detail:
  kicker: 'Organitzacions de suport europees: detall'
  title: Finestretes úniques, paraigües i on es troben.
  sections:
  - title: Finestretes úniques per a la rehabilitació d'edificis
    paras: ['La Directiva refosa de eficiència energètica d''edificis (UE) 2024/1275 les fa obligatòries: els estats membres han de proveir almenys una finestreta única per cada 80.000 habitants, per regió, o a menys de 90 minuts de trajecte mitjà, i el termini de transposició era el 29 de maig de 2026. La Recomanació (UE) 2026/536 del 10 de març de 2026 dona orientacions pràctiques sobre els serveis i prioritza les llars vulnerables, les persones afectades per la pobresa energètica i els residents d''habitatge social.', 'El projecte EU Peers (LIFE, de setembre de 2023 a agost de 2026, continuat com a EU Peers II fins al 2029) ha creat un centre de coneixement i laboratoris d''aprenentatge sobre models de negoci, aliances i partenariats, activació de propietaris, seguiment de l''impacte, governança multinivell, pobresa energètica i qualitat de les obres, incloent com les dades de qualitat faciliten el finançament bancari. A la província de Girona, el projecte LIFE GiDomus, liderat per la
        Fundació Europace (d''octubre de 2024 a setembre de 2027), perfecciona un servei de finestreta única complet amb suport administratiu, tècnic i financer a través d''oficines locals, incloent la rehabilitació de 104 habitatges a Banyoles.']
  - title: Organitzacions paraigua per a comunitats energètiques
    paras: ['Els paraigües, les cooperatives de segon grau i les agències regionals donen suport a moltes comunitats energètiques sota un marc comú de governança i serveis. El projecte LIFE SOSS4EREC, iniciat l''octubre de 2026, treballa amb quatre paraigües molt diferents (un grup d''acció local rural, una cooperativa jove sorgida d''una consultoria, una cooperativa regional de segon grau i una agència pública regional d''energia) que donen suport a 175 comunitats energètiques i arriben a unes 700 al conjunt del consorci. Cocrea un catàleg de 34 serveis (25 tècnics, 5 socials i 4 de governança) per a cinc tipus de projecte: flexibilitat, calefacció i refrigeració urbanes, rehabilitació d''edificis, autoconsum fotovoltaic col·lectiu i emmagatzematge.', 'Els paraigües comparteixen tres debilitats: trobar enfocaments de servei i aliances que encaixin amb el seu context, mantenir les competències en un camp que demana innovació contínua, i ser financerament sostenibles quan les comunitats tenen
        pocs diners, sobretot en la fase de desenvolupament i en els serveis de governança i socials.']
  - title: On es troben
    paras: ['La iniciativa europea de rehabilitació liderada per la ciutadania, impulsada per la Direcció General d''Energia de la Comissió Europea, ajuda les comunitats energètiques a organitzar la rehabilitació per als seus membres i creix ara amb una xarxa d''11 organitzacions. Dins seu, el projecte COLOUR de la Fundació Europace, OECOOP i IREC ajuda les comunitats energètiques a dissenyar i fer una rehabilitació col·lectiva, amb suport tècnic, administratiu i legal, financer i social, formació, i un camí de cinc passos, des d''explorar l''oportunitat fins a verificar les obres.']
  links_title: Lectures addicionals
  links:
  - {label: Guia de la UE sobre finestretes úniques per a la rehabilitació (Recomanació (UE) 2026/536), url: 'https://managenergy.ec.europa.eu/publications/eu-publishes-guidance-one-stop-shops-building-renovation_en'}
  - {label: Centre de coneixement d'EU Peers, url: 'https://www.eu-peers.eu/knowledge-hub'}
  - {label: Projecte LIFE GiDomus, url: 'https://en.gidomus.cat/'}
  - {label: Projecte COLOUR, url: 'https://www.fundacioeuropace.com/colour'}
  - {label: Iniciativa europea de rehabilitació liderada per la ciutadania, url: 'https://citizen-led-renovation.ec.europa.eu/index_en'}
offer:
  kicker: Què ofereix l'Aliança
  title: Cinc línies de servei, de la primera idea a l'operació diària, sobre un mateix fons comú de dades.
  lead: Un estudi de viabilitat, una sol·licitud de finançament i un tauler d'operació parteixen de les mateixes dades. Els membres presten serveis a les comunitats; l'Aliança desenvolupa, prova i comparteix els blocs que fan servir, perquè cap comunitat, organització paraigua o ciutat hagi de construir-los sola.
  lines:
  - {n: 1, title: Eines i plataformes digitals, text: 'Un fons comú de dades obert i un registre de casos comú; bessons digitals interoperables que avaluen opcions en dies i modelen l''energy sharing i la capacitat d''acollida de la xarxa; eines d''operació; una versió amb poques dades per a comunitats petites, remotes i del Sud global; cribratge del parc d''edificis per a la rehabilitació col·lectiva; gestió de casos per a finestretes úniques i paraigües.'}
  - {n: 2, title: Suport al finançament, text: 'Finançament mancomunat que capta capital comunitari un sol cop i el presta a molts projectes; un paquet de projecte per a inversors generat des del bessó digital; acords marc amb bancs ètics, cooperatives de crèdit i plataformes de micromecenatge; mètriques d''impacte que els finançadors accepten; agregació de projectes petits en carteres; dades de qualitat verificades per als prestadors.'}
  - {n: 3, title: Suport legal i polític, text: 'Estatuts, reglaments i plantilles d''ofertes de participacions per a cada jurisdicció; una comparació viva de normes d''energy sharing, accés al mercat, valors, cooperatives i fiscalitat; evidència per a la incidència dels membres; llistes de permisos i contractes tipus, també per a edificis amb diversos propietaris o de lloguer.'}
  - {n: 4, title: Serveis tècnics per a tipus de projecte en creixement, text: 'Procediments i models de negoci provats més enllà de la solar a la coberta: autoconsum col·lectiu, emmagatzematge, flexibilitat de la demanda, calefacció i refrigeració urbanes, rehabilitació i renovació liderada per la comunitat, mobilitat elèctrica compartida. Inclou un camí de rehabilitació col·lectiva i xarxes de professionals acreditats.'}
  - {n: 5, title: Serveis socials i de governança, text: 'Participació ciutadana i sensibilització, activació i cocreació amb grups de treball locals, governança inclusiva i formació de consells rectors, mesures contra la pobresa energètica i per a llars vulnerables, i formació per a ciutadania, professionals i consells. Fan que els projectes siguin acceptats, justos i duradors, i són els menys compartits avui.'}
  more_link: Llista completa de serveis a l'annex
  table_title: La taula de confiança i els serveis mancomunats
  table_text: Els membres poden mancomunar assegurances, compres conjuntes, serveis legals i acords marc de finançament per reduir costos a les comunitats petites. Al voltant d'un projecte cada cop, un panell d'experts porta la ciutat, la companyia elèctrica, els finançadors, els promotors i els veïns a una decisió; els centres de recerca i els projectes presenten ofertes conjuntes perquè els mètodes es provin on compten; i els membres parlen amb evidència quan decideixen parlar junts.
  support_title: Suport a les organitzacions de suport
  support_items: ['Models de negoci i plans de sostenibilitat per a organitzacions públiques, privades i híbrides.', 'Tallers entre iguals, mentoria i comunitats de pràctica entre organitzacions madures i emergents, entre països.', 'Un catàleg compartit de procediments de servei, amb costos i resultats, perquè una organització adopti un servei provat en comptes de dissenyar-lo.', Ajuda per combinar els rols de finestreta única de rehabilitació i de paraigua de comunitats energètiques allà on la política ho permeti.]
  why_title: Per què aquesta aliança
  why:
  - {title: Neutral per disseny, text: 'Una carta breu, òrgans equilibrats entre famílies de membres i orientació sobre competència, perquè els competidors puguin seure a la mateixa taula. L''Aliança facilita; mai tria guanyadors.'}
  - {title: Oberta on importa, text: 'El model de dades, el registre de casos i les plantilles de servei són oberts per defecte; els membres conserven les seves eines i el seu negoci.'}
  - {title: Sense competir amb els membres, text: L'Aliança construeix blocs compartits; els membres presten els serveis a les comunitats.}
  - {title: Digital i social alhora, text: La majoria d'iniciatives ofereixen eines o serveis de suport. L'Aliança uneix les dues coses al voltant de les mateixes dades i el mateix registre de projecte.}
  - {title: Global des del principi, text: 'Els membres del Canadà, d''Europa i del Sud global aprenen de les normes, els models de finançament i els catàlegs de serveis dels altres.'}
offer_detail:
  kicker: 'Què ofereix l''Aliança: detall'
  title: Les cinc línies de servei en detall.
  lines:
  - title: 1. Eines i plataformes digitals per a la planificació i l'operació
    items: ['Un fons comú de dades obert: un model de dades i un registre de casos comuns que cobreixen generació, emmagatzematge, xarxes de calor, rehabilitació, mobilitat, propietat, finançament i resultats socials, perquè cada cas sigui comparable i cada eina el pugui llegir.', 'Eines de planificació interoperables: bessons digitals que avaluen les opcions d''una comunitat en dies (solar, eòlica, emmagatzematge, bombes de calor i calefacció i refrigeració urbanes, rehabilitació, mobilitat compartida), modelen l''energy sharing segons les normes locals i estimen la capacitat d''acollida de la xarxa amb les elèctriques.', 'Eines d''operació: seguiment que compara el funcionament amb el disseny, flexibilitat i gestió de bateries, i taulers senzills que mostren als membres què produeix, estalvia i guanya el seu projecte.', 'Adaptat a cada context: una versió amb poques dades per a comunitats petites, remotes i del Sud global, desenvolupada amb membres com Azimut 360.', 'Dades d''edificis
        i rehabilitació: cribratge del parc d''edificis que troba grups d''habitatges adequats per a la rehabilitació col·lectiva, enllaços amb passaports de renovació, i un registre per edifici des del primer assessorament fins a les obres verificades.', 'Eines per a organitzacions de suport: un mòdul compartit de recorregut del client i gestió de casos per a finestretes úniques i paraigües, i taulers de qualitat i impacte que també serveixen a prestadors i finançadors.']
  - title: 2. Suport al finançament
    items: ['Finançament mancomunat: models que capten capital comunitari un sol cop i el presten a molts projectes, mentre el capital i el control locals es queden locals.', 'Dades finançables: un paquet de projecte per a inversors generat des del bessó digital, que redueix el temps i el cost de la diligència deguda.', 'Acords marc de finançament amb bancs ètics, cooperatives de crèdit i plataformes de micromecenatge, i ajuda per fer coincidir cada etapa del projecte amb finançament públic.', 'Mètriques d''impacte que els finançadors accepten: ingressos locals, llocs de treball, emissions, acceptació i resultats en pobresa energètica, mesurats igual a tot arreu.', 'Agregació: agrupar projectes petits de rehabilitació i energia en carteres prou grans per als prestadors, combinant subvencions públiques, préstecs verds i micromecenatge comunitari.', 'Dades de qualitat per al finançament: obres verificades i estalvis mesurats en què els prestadors puguin confiar, partint del treball d''EU Peers
        sobre qualitat i finançament bancari.']
  - title: 3. Suport legal i polític
    items: ['Estatuts, reglaments i plantilles d''ofertes de participacions per a cada jurisdicció, perquè una nova comunitat no pagui un altre cop la mateixa feina legal.', 'Normes comparades: una comparació viva de normes d''energy sharing, accés al mercat, valors, cooperatives i fiscalitat entre països i províncies.', 'Evidència política: llibres blancs i guies de referència que els membres fan servir en la seva pròpia incidència, i posicions comunes allà on els membres coincideixen.', 'Permisos, llicències i contractes: llistes de permisos, contractes tipus per a la rehabilitació col·lectiva en edificis amb diversos propietaris o de lloguer, i revisió d''acords d''obres i de finançament.']
  - title: 4. Serveis tècnics per a tipus de projecte en creixement
    intro: 'Procediments de servei i models de negoci provats per als tipus de projecte que les comunitats assumeixen ara més enllà de la solar a la coberta: fotovoltaica col·lectiva i autoconsum, emmagatzematge, flexibilitat de la demanda i agregació, calefacció i refrigeració urbanes (incloses xarxes de baixa temperatura), rehabilitació d''edificis i renovació liderada per la comunitat, i mobilitat elèctrica compartida. Les finestretes úniques que ja ofereixen un servei el comparteixen; les que no, el poden adoptar.'
    items: ['Un camí de rehabilitació col·lectiva: des del diagnòstic i un preestudi gratuït, passant per la decisió de la comunitat, la selecció de professionals locals i la comparació de pressupostos, fins al seguiment i la verificació de les obres, com a COLOUR.', 'Contractistes de confiança: xarxes de professionals acreditats i garantia de qualitat, perquè les comunitats confiïn en els contractistes i els prestadors en els resultats.']
  - title: 5. Serveis socials i de governança
    intro: Participació ciutadana i sensibilització des de la creació fins a l'operació, governança inclusiva i formació de consells rectors, mesures contra la pobresa energètica i per a llars vulnerables, i suport a la cooperació entre comunitats.
    items: ['Activació i cocreació: campanyes d''activació de propietaris i membres, i grups de treball locals que porten comunitats, ciutadania i administracions públiques al disseny dels serveis, com a SOSS4EREC.', 'Pobresa energètica: suport dirigit a llars en pobresa energètica i vulnerables, amb atenció a l''equitat de gènere.', 'Formació: formació per a ciutadania, col·lectius vulnerables, professionals i consells de les comunitats.']
revenue:
  kicker: Serveis que poden generar ingressos
  title: Tres serveis mostren com les eines compartides poden generar ingressos per als membres i finançar el fons comú.
  lead: L'Aliança, amb els centres de recerca associats, pot prestar i facturar serveis per als seus membres. També manté les eines i mètodes compartits, forma i certifica els prestadors, i rep una quota de llicència o una petita part dels ingressos quan són els membres qui presten i facturen el servei.
  fields: {how: Com funciona, who: Qui paga, rev: Ingressos, why: Per què a través de l'Aliança}
  services:
  - {title: Planificació de calefacció i refrigeració urbanes amb TOOLS4Cities, tagline: 'Un servei de planificació que diu en setmanes a un ajuntament, cooperativa o promotor si una xarxa de calor de barri té sentit, i com construir-la i tenir-ne la propietat.', how: 'Un bessó digital del barri a partir de dades d''edificis, sòl i energia; demanda horària de calefacció i refrigeració avui i després de rehabilitar; opcions de subministrament com bombes de calor grans, geotèrmia, calor residual i solar tèrmica; dimensionament i traçat de la xarxa, incloses xarxes de baixa temperatura i de cinquena generació; comparació de costos, emissions i models de propietat.', who: Ajuntaments i agències regionals que preparen plans de calor; cooperatives i comunitats energètiques; elèctriques i promotors que avaluen emplaçaments; finançadors que exigeixen un estudi de prefactibilitat., rev: 'Una tarifa fixa per estudi de prefactibilitat, una tarifa més gran per un estudi detallat amb tallers amb les
      parts interessades, i una llicència anual per a organitzacions que fan servir l''eina. Un cop construïda la xarxa, una subscripció per a operació i seguiment.', why: 'Una sola eina i un sol model de dades vol dir que cada estudi, al Canadà o a Europa, fa servir el mateix mètode, de manera que els resultats es comparen i el mètode millora amb cada cas. Punts de partida: el treball d''energia de districte amb la ciutat de Montréal i l''interès dels paraigües europeus per les xarxes de baixa temperatura.'}
  - {title: Serveis de flexibilitat i resposta a la demanda, tagline: 'Un servei que converteix les bombes de calor, bateries, vehicles elèctrics i escalfadors d''aigua d''una comunitat en capacitat flexible, i guanya diners usant-la quan la xarxa ho necessita.', how: 'El bessó digital operatiu preveu la demanda i la producció solar de cada emplaçament; un agregador (la comunitat, un paraigua o un soci) desplaça el consum fora de les hores punta i gestiona les bateries dins dels límits de confort acordats amb els membres; els resultats es mesuren i verifiquen respecte d''una línia de base.', who: 'Elèctriques i operadors de xarxa mitjançant programes de resposta a la demanda i mercats locals de flexibilitat; comercialitzadores que redueixen compres en punta; i els membres, que abaixen la factura i aprofiten més la seva pròpia solar.', rev: 'Pagaments per capacitat i per energia desplaçada, repartits entre membres i agregador; una tarifa de servei per previsió, gestió i verificació; reforços
      de xarxa evitats, valorats conjuntament amb l''elèctrica.', why: 'Les normes de flexibilitat difereixen per país i província. L''Aliança manté un mètode comú de línies de base i verificació, una comparació de normes de mercat i interfícies obertes amb les eines dels membres, perquè una comunitat pugui oferir flexibilitat sense construir la seva pròpia plataforma.'}
  - {title: Rehabilitació zero emissions i integració de renovables, tagline: 'Un servei de finestreta única que porta un edifici o un grup d''edificis a un estàndard zero emissions, combinant rehabilitació profunda, bombes de calor, solar i emmagatzematge in situ, i connectant-los al sistema energètic de la comunitat.', how: 'El cribratge del parc d''edificis troba grups d''edificis semblants; l''eina de rehabilitació energètica d''edificis urbans de TOOLS4Cities compara paquets per cost de cicle de vida i emissions; el servei prepara un passaport de renovació, un paquet d''obres agrupat amb contractistes acreditats, un pla de finançament i, quan és possible, la propietat comunitària de la solar i l''emmagatzematge; després el seguiment verifica els estalvis.', who: 'Propietaris i comunitats de veïns, proveïdors d''habitatge social i cooperatiu, ajuntaments per a edificis públics, i finestretes úniques que compren l''anàlisi per als seus clients.', rev: 'Tarifes per avaluació i gestió de
      projecte; un marge en compres agrupades; tarifes basades en resultats lligades als estalvis verificats; ingressos de la solar i l''emmagatzematge de propietat comunitària, amb dividends compartits entre els membres.', why: 'La EPBD refosa exigeix finestretes úniques a tota la UE i busca un parc d''edificis zero emissions el 2050, així que la demanda creixerà de pressa. Eines compartides, plantilles de contracte i dades de qualitat permeten que finestretes úniques i paraigües ho ofereixin a un cost assumible per a comunitats petites.'}
  note: 'Cap d''aquests ingressos és encara al pressupost. És un potencial a provar: la disposició a pagar és un dels riscos oberts que pensem comprovar amb entrevistes i una prova de preus. El repartiment entre membres i l''Aliança (quota de llicència o petita part) s''ha d''acordar.'
members_summary:
  kicker: Qui hi participa
  title: 'Sis tipus de membres, una taula compartida: què guanya i què aporta cadascun.'
  lead: Cada família aporta alguna cosa que les altres no tenen, i guanya alguna cosa que no podria construir sola.
  cols: [Membre, Què hi guanya, Què hi aporta]
  rows:
  - ['Xarxes comunitàries i cooperatives, finestretes úniques i paraigües', 'Un catàleg de serveis tècnics, socials i de governança provats per adoptar en comptes de dissenyar; assegurances, compres i serveis legals mancomunats; eines que fan cada projecte nou més ràpid i barat', 'Projectes i membres reals, experiència de camp, serveis per compartir']
  - [Ciutats i regions, Eines de cribratge per a l'acollida o la copropietat municipal; processos facilitats que porten un projecte a una decisió; dades d'impacte comparables per als plans climàtics, 'Emplaçaments, edificis, dades locals, capacitat de convocatòria']
  - [Operadors de xarxa i elèctriques, Projectes comunitaris dissenyats tenint en compte les restriccions de la xarxa; mètodes de capacitat d'acollida i flexibilitat; un únic interlocutor per a molts projectes petits, 'Dades i models de xarxa, coneixement de connexions']
  - [Centres de recerca, Projectes reals per provar mètodes; ofertes conjuntes amb professionals; un model de dades comú que fa comparables els estudis, 'Eines, mètodes, personal en formació, credibilitat científica']
  - [Finançadors i institucions financeres, 'Una cartera de projectes preparats per invertir, paquets de projecte estàndard i mètriques d''impacte mesurades igual entre països', 'Capital, disseny de programes, acords marc']
  - [Professionals del Sud global, Eines i serveis adaptats a contextos amb poques dades i fora de xarxa; socis per a projectes i finançament conjunts, 'Experiència en microxarxes i accés a l''energia, nous mercats per al fons comú']
  note: Les aliances amb el Sud global, començant per Azimut 360 (microxarxes i comunitats energètiques a l'Àfrica subsahariana), es descriuen a l'annex. Allà també hi ha el que aporta i rep cadascú, i el paquet de fundadors.
