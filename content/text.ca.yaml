  title: "De la primera prova a un organisme de referència."
  phases:
    - {when: "Fins a mitjan 2027 · Fonaments", title: "Ser creïble", text: "Associació creada, membres fundadors, decisió sobre l'Annex, primeres propostes."}
    - {when: "2027–2029 · Demostrar", title: "Mostrar que funciona", text: "Prototip de l'Annex i estudis de cas, oficina de propostes activa, primers processos liderats pel panell d'experts, primera formació i documents de posició."}
    - {when: "2030–2032 · Escalar", title: "Esdevenir el referent", text: "Cicle de versions, hubs regionals, acords marc amb ciutats i operadors de xarxa."}
    - {when: "2033–2036 · Institucionalitzar", title: "Referència estable", text: "Estàndards citats per finançadors i reguladors, finançament plurianual estable."}
  note: "Dates indicatives; depenen del finançament i de la decisió de l'ExCo sobre la proposta d'Annex presentada a principis d'octubre de 2026 (amb el suport de NRCan; reunió de l'ExCo al novembre de 2026). Si s'aprova, l'Annex dura 1 any de preparació, 3 de treball i 1 d'informes."
