lessons:
  kicker: "Lliçons d'altres iniciatives"
  title: "El que projectes anteriors ja ens han ensenyat."
  lead: "El repartiment d'energia, l'agregació i el seguiment comunitari s'han provat en molts llocs. Les mateixes lliçons tornen a aparèixer i determinen què ha de fer i què no ha de fer l'Aliança."
  evidence: "Evidència"
  implication: "Per a l'Aliança"
  items:
    - title: "Escalar és més difícil que la tecnologia"
      text: "Les plataformes de repartiment i comerç local van funcionar en pilots. Créixer va topar amb la regulació, la facturació i la implicació dels membres abans que amb la tecnologia."
      evidence: "Revisions de plataformes entre iguals; la principal dificultat inicial del Brooklyn Microgrid va ser vendre energia a través de la factura d'una companyia elèctrica sense ser regulat com a tal."
      implication: "Compartir entre membres coneixement regulatori i de facturació, no només codi."
    - title: "Els ingressos de flexibilitat sols rarament paguen"
      text: "El que s'obté de desplaçar o reduir càrrega és petit comparat amb l'esforç. Funciona quan forma part d'un cas de negoci més ampli."
      evidence: "El Project LEO (Oxfordshire, 2019 a 2023) va concloure que els ingressos de flexibilitat han de formar part d'un cas més ampli."
      implication: "Presentar l'agregació com un servei entre d'altres i comparar casos de negoci amb els mateixos indicadors."
    - title: "Primer, els estàndards de dades"
      text: "L'estandardització, l'automatització i la inversió en dades van ser els factors clau. Sense ells, cada comunitat nova comença de zero."
      evidence: "Informe final del Project LEO; accés a dades de comptadors intel·ligents a Àustria (plataforma de comunicació de mercat, EDDIE de codi obert, interfície ISEG, qualitat de dades QODEC)."
      implication: "És l'argument a favor del nucli compartit: ontologia, captura de dades i procedència."
    - title: "Les regles de repartiment les fixen reguladors i operadors de xarxa"
      text: "Com es reparteix l'energia entre membres depèn de les normes nacionals i de la voluntat de l'operador d'aplicar-les. Molts països encara usen coeficients estàtics."
      evidence: "Portugal: coeficients fixos, proporcionals, jeràrquics i dinàmics, amb un pilot aprovat de dinàmics. Espanya: normalment coeficients estàtics i radi de 2 km. Alemanya: el repartiment d'energia és legal des de l'1 de juny de 2026, però encara sense regles vinculants de claus de repartiment i pocs operadors ofereixen subministrament a nivell d'edifici."
      implication: "Mantenir una taula comparativa de normes i de pràctica dels operadors. És barata de mantenir i valuosa per a tots els membres."
    - title: "Els veïns necessiten un relat, no una tarifa"
      text: "La gent respon a una raó clara i a un missatger de confiança. La implicació repetida amb aplicacions de comerç és feble."
      evidence: "Project LEO (aprendre a parlar amb els residents de flexibilitat); revisions de plataformes entre iguals; lliçons d'implicació social d'H2020."
      implication: "Aquí la facilitació i el panell d'experts aporten un valor que el programari no dona."
    - title: "Els beneficis rarament s'avaluen, i mai de la mateixa manera"
      text: "Poques iniciatives mesuren resultats de manera empírica, i les que ho fan usen indicadors diferents, de manera que no es poden comparar."
      evidence: "Revisions de pilots entre iguals; el Smart Energy Communities Benchmark del Canadà és una autoavaluació de deu indicadors per a nou municipis pilot; existeix un conjunt acadèmic de 25 indicadors però no s'usa gaire."
      implication: "Publicar un conjunt mínim d'indicadors comuns i una fitxa de cas, i demanar als membres que hi informin."
    - title: "Les cooperatives s'estan movent cap a l'agregació"
      text: "Les cooperatives energètiques exploren el rol d'agregador per donar valor a la flexibilitat dels seus socis."
      evidence: "REScoopVPP (uns 4 milions d'euros, 2020 a 2023, pilots a Bèlgica, França, Alemanya, Espanya i el Regne Unit); Enercoop es va convertir en responsable d'equilibri; Som Energia ha estudiat ser agregador."
      implication: "L'agregació és una activitat dels membres. L'Aliança l'hauria de documentar i comparar, no executar."
    - title: "Els intermediaris fan que els projectes locals arrenquin"
      text: "Un convocant neutral amb prou autoritat per liderar desbloqueja projectes encallats entre actors."
      evidence: "El nostre historial: districte de calor a Laval i Concordia, ABC Accelerator, CÔTÉ (vegeu el capítol de facilitació)."
      implication: "Mantenir el lideratge del procés dins l'oferta, al costat de les eines."
  kpi_title: "Un punt de partida per als indicadors comuns"
  kpi_lead: "Per comparar comunitats, el primer pas és acordar un conjunt petit i compartit, agrupat com els marcs publicats. És una proposta per a debat, a provar amb els membres."
  kpi:
    - {title: "Energia", text: "Autoconsum, autosuficiència, part de la demanda coberta localment, punta de demanda i la seva reducció, flexibilitat aportada."}
    - {title: "Econòmic", text: "Cost per membre, estalvi, ingressos per repartiment i flexibilitat, inversió per kW, retorn."}
    - {title: "Social", text: "Membres, part de llars vulnerables, participació i permanència, indicadors de govern."}
    - {title: "Ambiental", text: "Emissions evitades, part renovable local i el mètode de càlcul."}
    - {title: "Capacitat (del benchmark canadenc)", text: "Govern, personal, dades, finançament i estratègia del municipi o la comunitat."}
    - {title: "Qualitat de les dades", text: "Per a cada valor: mesurat, modelat o declarat; font; període; resolució."}
  gaps_title: "Què no hem trobat"
  gaps:
    - "Un percentatge verificat de reducció de punta en un pilot real d'agregació d'una comunitat energètica; les fonts trobades descriuen dissenys i objectius."
    - "Eines de repartiment documentades de cooperatives espanyoles i de pilots canadencs més enllà dels règims regulatoris; per confirmar amb els membres."
    - "Els models de dades de la majoria de les eines anteriors. Les afirmacions dels proveïdors a la taula d'eines estan marcades com a tals i s'han de tractar com a no verificades."
    - "El resultat del Brooklyn Microgrid després dels anys de pilot."
  note: "Recerca documental, octubre de 2026. Corregiu i afegiu iniciatives; aquesta llista ha de créixer amb l'experiència dels membres."

south:
  kicker: "Socis del Sud global"
  title: "Un pont cap als països on les microxarxes i l'energia comunitària són la manera d'accedir a l'electricitat."
  lead: "A Europa i al Canadà, les comunitats optimitzen una xarxa existent. En molts països del Sud global, les microxarxes i els sistemes gestionats per la comunitat són sovint el primer accés a l'electricitat. Les preguntes són properes (dimensionament, dades, indicadors, govern, finançament), així que les eines i les lliçons poden viatjar en les dues direccions. Azimut 360 hi aportaria aquesta experiència."
  why_title: "Per què té lloc a l'Aliança"
  why:
    - {title: "Mateixes preguntes, punt de partida diferent", text: "Planificació, captura de dades, indicadors i govern compten en tots dos contextos. Un nucli compartit que també serveixi per a casos aïllats de xarxa i minixarxes és més robust."}
    - {title: "Les lliçons viatgen en dues direccions", text: "Els projectes del Sud fa temps que treballen amb propietat local, pressupostos ajustats i xarxes febles. Les comunitats del Nord s'enfronten ara a preguntes de flexibilitat i resiliència del mateix tipus."}
    - {title: "Una base de finançament més àmplia", text: "Els finançadors de desenvolupament i clima donen suport a la feina que lliga Nord i Sud. Una oferta conjunta podria arribar a línies que una de purament europea o canadenca no pot (per explorar; res no està compromès)."}
  azimut_title: "Què aporta Azimut 360"
  azimut_text: "Una cooperativa catalana fundada el 2009, part de la xarxa d'economia social i solidària, amb enginyeria i execució de projectes d'energia solar fotovoltaica a Espanya i a l'estranger."
  azimut:
    - {title: "Microxarxes rurals", text: "Forta especialització en electrificació rural amb microxarxes, incloent-hi projectes de salut i energia, com electricitat per a hospitals, escoles i aigua."}
    - {title: "Experiència subsahariana", text: "Feina en països com Burkina Faso, Costa d'Ivori, Ghana, Moçambic, Uganda i Gàmbia, amb coneixement directe de les limitacions de logística, seguretat i capacitat local."}
    - {title: "Models comunitaris i cooperatius", text: "Experiència declarada en comunitats energètiques i models cooperatius; un spin-off, Azimut O2, treballa en oxigen mèdic solar."}
  azimut_note: "A partir de descripcions públiques d'Azimut 360, octubre de 2026. Per confirmar i completar amb Azimut."
  work_title: "Com podria ser la feina"
  work:
    - {title: "Ampliar la fitxa de cas", text: "Descriure casos de microxarxes i comunitats del Sud amb els mateixos camps i indicadors que els del Nord, perquè es puguin comparar."}
    - {title: "Adaptar el nucli compartit", text: "Comprovar que l'estructura de dades, el protocol de captura i els indicadors també serveixen per a sistemes aïllats i minixarxes, i per a contextos amb poques dades."}
    - {title: "Aprenentatge entre iguals Nord-Sud", text: "Intercanvi entre cooperatives, ciutats i centres de recerca sobre models de propietat, tarifes, manteniment i govern comunitari."}
    - {title: "Propostes conjuntes", text: "Coescriure propostes amb socis del Sud i universitats locals, amb l'Aliança com a convocant i els membres com a executors."}
    - {title: "Capacitació i formació", text: "Material formatiu i eines obertes reutilitzats en contextos del Sud, adaptats pels socis locals."}
    - {title: "Facilitació", text: "La taula neutral amb lideratge, aplicada a processos locals on una comunitat, una empresa elèctrica i un finançador s'han de posar d'acord."}
  scope_title: "On s'atura l'Aliança"
  scope_in_title: "Dins l'abast"
  scope_in:
    - "Eines compartides, fitxes de cas i indicadors que cobreixin casos del Sud."
    - "Convocar i coescriure propostes amb socis del Sud."
    - "Aprenentatge entre iguals i formació."
  scope_out_title: "Fora de l'abast"
  scope_out:
    - "Contractes d'enginyeria, compra o instal·lació: és el que fan membres com Azimut 360."
    - "Consultoria per a un sol client."
    - "Actuar com a agència de desenvolupament o gestionar fons de projectes per als executors."
  open_title: "A decidir amb Azimut 360 i la resta de membres"
  open:
    - "Paper d'Azimut 360: membre fundador, associat o soci en propostes concretes [?]."
    - "Amb quins països o regions començar, i amb quins socis locals [?]."
    - "Model de quotes per als socis del Sud: reduït, gratuït o en espècie [?]."
    - "Quines línies de finançament cal apuntar, i qui lidera cada proposta [?]."
    - "Com s'enllaça amb la proposta d'Annex de l'IEA i amb el pressupost de l'Aliança [?]."
  note: "Esborrany per a debat. Cap compromís per part de ningú encara."
