  lead: "Un equip reduït encapçalat per un/a director/a de l'aliança, amb un/a investigador/a assistent i pràctiques d'estudiants, finançat amb una barreja de contribucions en espècie, aportacions de socis i ingressos de projectes. Tots els imports en EUR."
  stats:
