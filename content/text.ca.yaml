footer:
  independence: "<b>Independència i noms.</b> Aquesta és una proposta preliminar independent, no un programa oficial de cap organització esmentada. Res no implica el suport de la Comissió Europea, de l'IEA o dels seus programes, de REScoop.eu ni de cap altre organisme. Les il·lustracions fan servir dades hipotètiques."
  references: "<b>Referències.</b> Comissió Europea (pàgina de comunitats energètiques; Paquet d'Energia Ciutadana); informes anuals de REScoop.eu; Mapping of Energy Communities in Europe, <i>Sustainability</i> 2023, doi 10.3390/su15108201; Systematic Review of Software and Algorithms for RECs, <i>Energies</i> 2026, doi 10.3390/en19163718; Digital Twin Architectures for Buildings and RECs, <i>Sustainability</i> 2026, doi 10.3390/su18125869; Synergy Between Demand Flexibility and Energy Communities, <i>Sustainability</i> 2026, doi 10.3390/su18041858; TwinEU (twineu.net); DSO4DT (DSO Entity)."
