  note: "Xifres previstes. Els gràfics i la taula completa són a l'annex."
govern:
  kicker: "Com funciona"
  title: "Neutral per disseny, perquè els competidors puguin seure a la mateixa taula."
  columns:
    - title: "Una carta breu"
      items: ["Obert per defecte pel que fa al nucli compartit", "Els membres conserven la seva feina pròpia", "Cap servei que competeixi amb els membres", "Orientació de dret de la competència a totes les reunions"]
    - title: "Òrgans equilibrats"
      items: ["Assemblea de tots els membres", "Junta equilibrada entre les cinc famílies de membres", "Comitè tècnic per al comú", "Panell d'experts per liderar els processos facilitats", "Secretaria petita"]
    - title: "Joc net en projectes"
      items: ["Els rols de lideratge roten amb criteris clars", "L'Aliança facilita, mai tria guanyadors", "Una part dels projectes guanyats torna al comú (si els finançadors ho permeten)"]
  note: "La forma jurídica comença com a associació espanyola (ràpida i barata) i podria passar a una entitat internacional sense ànim de lucre quan els membres i el finançament ho justifiquin."
