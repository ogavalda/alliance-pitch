  net_tab_on: "Amb l'Aliança: connectats"
  net_hub_title: "Aliança"
  net_hub_sub: "comú · cartera · veu"
  net_note: "Organitzacions reals del nostre mapa d'actors (recerca documental, octubre de 2026), mostrades com a exemples. Sortir-hi no implica participació ni suport. Anell rosa: ja implicades. Les línies són il·lustratives."
