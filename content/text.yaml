govern:
  kicker: "How it is run"
  title: "Neutral by design, so competitors can sit at the same table."
  columns:
    - title: "A short charter"
      items: ["Open by default for the shared core", "Members keep their proprietary work", "No services that compete with members", "Competition-law guidance for all meetings"]
    - title: "Balanced bodies"
      items: ["Assembly of all members", "Board balanced across the six member families", "Technical committee for the commons", "Panel of experts to lead facilitated processes", "Small secretariat"]
    - title: "Fair play on projects"
      items: ["Lead roles rotate with clear criteria", "The Alliance facilitates, never picks winners", "A share of won projects returns to the commons (if funders allow)"]
  note: "The legal form must not block the start: the next chapter sets out a plan B that begins now, with a collaboration agreement and a small Catalan association, while an international non-profit is worked out."

roadmap:
  kicker: "Long term"
  title: "From first proof to a reference body."
  phases:
    - {when: "To mid-2027 · Foundation", title: "Be credible", text: "Collaboration agreement signed and a small association registered (plan B), founding members, Annex decision, first proposals."}
    - {when: "2027–2029 · Prove", title: "Show it works", text: "Annex prototype and case studies, proposal desk live, first processes led by the expert panel, first training, first North-South case records and position papers."}
    - {when: "2030–2032 · Scale", title: "Become the default", text: "Release cycle, regional hubs, framework agreements with cities and grid operators, a training and technology-transfer programme with southern partners."}
    - {when: "2033–2036 · Institutionalise", title: "Stable reference", text: "Standards cited by funders and regulators, stable multi-year funding."}
  start_title: "It builds on work already under way"
  start:
    - {title: "Research engine", text: "A proposed IEA EBC Annex on enabling community energy through digital platforms, submitted with support from Natural Resources Canada; the open-source TOOLS4Cities urban digital-twin platform; and a proposed NSERC Alliance Society program led from Concordia's Next-Generation Cities Institute."}
    - {title: "Global convening", text: "A Global Expert Working Group on financing and evaluating community-led energy, proposed for June 2027 in Montréal with UN-Habitat and Indigenous Clean Energy."}
    - {title: "Service networks", text: "European one-stop shops and energy community umbrellas, with links through partners in SOSS4EREC, COLOUR and GiDomus, the EU Peers community and the EU Citizen-led Renovation initiative (which of them join as members or partners is to be confirmed)."}
  targets_title: "Five-year targets"
  targets: ["500 communities assessed worldwide", "One common, up-to-date database", "Tools used across countries", "3 active research projects", "At least 3 white papers and reference guides"]
  note: "Indicative dates; they depend on funding and on the ExCo decision on the Annex proposal submitted in early October 2026 (supported by NRCan; ExCo meeting in November 2026). If approved, the Annex runs 1 year of preparation, 3 of work and 1 of reporting."

