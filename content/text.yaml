why:
  kicker: "Why now"
  title: "Policy, money and technology are lining up on the local level."
  lead: "Three shifts make local energy the place where the transition is won or lost, and make the next few years a rare window to organise."
  cards:
    - {stat_key: policy, text: "<b>Policy.</b> The European Commission's 2026 Citizens Energy Package aims for roughly a tenfold rise in community-owned renewables by 2030. It is voluntary, so delivery depends on capacity on the ground."}
    - {stat_key: scale,  text: "<b>Scale.</b> Energy communities counted in the EU by the Commission (an academic mapping counts about 3,900: definitions differ). Cities, regions and grid operators are moving too."}
    - {stat_key: twins,  text: "<b>Technology and funding.</b> EU programmes already fund digital twins on the grid side (e.g. TwinEU, DSO4DT) and community facilities separately. The bridge between them is missing."}
  note: "Sources: European Commission, REScoop.eu, mapping study (Sustainability 2023), project sites. See references."

problem:
  kicker: "The problem"
  title: "The obstacle is not effort. It is <em>duplication and isolation</em>."
  lead: "Reviews keep finding the same pattern: tools and methods exist but are fragmented, hard to connect and rarely built for communities; start-ups lack expertise; evidence stays inside each project; and no one speaks for local energy systems with one voice. Projects also stall because the actors they depend on rarely sit at the same table."
  cards:
    - {title: "Fragmented tools", text: "Mature tools exist for design, but community-specific and interoperable ones are mostly prototypes."}
    - {title: "Evidence stays local", text: "Many ways to measure impact, none agreed, so lessons do not add up across projects."}
    - {title: "No shared voice", text: "Communities, cities and grid operators lobby separately, often on the same issues."}
    - {title: "No neutral table", text: "City, utility, financiers, developers and neighbours rarely meet around the same project, so it stalls between planning and implementation."}
  note: "Based on our review of recent literature on energy community gaps (2021 to 2026)."

landscape_summary:
  kicker: "Many tools, no common foundations"
  title: "Good tools exist. They do not share foundations."
  text: "We reviewed {n} tools and tool families for managing energy communities and local energy systems, from research projects, networks, public bodies and companies. Each has its own front end, back end, data model and indicators. For {m} of them we could not find the data model documented in public sources."
  points:
    - {title: "Different front ends are fine", text: "Users differ, so interfaces should too."}
    - {title: "Different foundations are costly", text: "Data structure, data capture and indicators are rebuilt each time, so tools are hard to integrate and cases hard to compare."}
    - {title: "A shared core would help", text: "If a tool disappears or two tools join, data and indicators keep their meaning."}
  note: "The map and tables of tools are in the annex."

landscape:
  kicker: "The tools that exist today"
  title: "Many good tools. Each one built on its own foundations."
  lead: "Community and local energy management already has tools from research projects, networks, public bodies and companies. It is healthy that front ends differ: users are different. The problem is underneath: every tool organises its data, its data capture and its indicators in its own way."
  map_title: "The landscape on one map"
  map_lead: "Each tool sits by topic (rows) and by the scale it works at (columns). Colour it by who builds it or by where it comes from."
  map_by_who: "Colour by who builds it"
  map_by_geo: "Colour by where it comes from"
  map_note: "Our first classification from public descriptions; a tool can cover several scales (wider boxes). Click a box to open its source. Classification is editable in tools.yaml."
  matrix_title: "A first list of tools (to be completed)"
  matrix_note: "Desk research, October 2026. A question mark means we did not find it documented in public sources, not that it does not exist. Please correct and complete the list."
  stack_title: "What happens under the hood"
  stack_lead: "Switch between today and a world with a shared core."
  tab_today: "Today: each tool has its own foundations"
  tab_core: "With a shared core: same foundations, different tools"
  rows:
    row_frontend: "Front end"
    row_model: "Data model"
    row_capture: "Data capture"
    row_kpis: "Key indicators"
    row_backend: "Back end"
    row_model_core: "Shared ontology: building and geospatial metadata, socioeconomic structure, real-case records"
    row_capture_core: "Shared capture and provenance protocol: what is collected, how, by whom, measured or modelled"
    row_kpis_core: "Shared indicator definitions: formulas, units, boundaries"
  stack_note: "Illustration built from the table above. Only the middle layers are shared; each organisation keeps its own front end, back end and extra data."
  core_title: "The shared core: five layers developed once, used by all"
  core_lead: "Not a platform and not a database: a common structure and vocabulary that any tool can read and write."
  benefits:
    - {title: "If a tool disappears", text: "The data survives in a structure others can read, instead of being lost with the tool."}
    - {title: "If two tools want to join", text: "Integration is mapping to the same core once, not rewriting every connector."}
    - {title: "If a community compares cases", text: "Real cases are described with the same fields and indicators, so they can be compared."}
    - {title: "If you want to keep your own approach", text: "You keep your front end, back end and extras. Exchange within the association is optional."}
  split_title: "Core versus yours"
  split_core: "Core (shared, versioned, open): ontology, capture and provenance rules, indicator definitions, case-record format."
  split_yours: "Yours: front ends, back ends, algorithms, local extras (with a clear prefix), and whatever you choose to exchange."

members_summary:
  kicker: "Who takes part"
  title: "Five kinds of members, one shared table."
  lead: "Community and cooperative networks, cities and regions, research centres, grid operators and utilities, and funders. Each brings something the others lack."
  families: ["Community networks", "Cities and regions", "Research centres", "Grid operators and utilities", "Funders and institutions"]
  note: "What each brings and gets, and the founders' package, are in the annex."

alliance:
  kicker: "The proposal"
  title: "An alliance with four jobs."
  lead: "Digital twins are the shared language and the first thing we build, but the Alliance is about what organisations can do together. Select a job."
  jobs:
    - title: "Commons"
      tagline: "Shared, open building blocks that no one wins by keeping private."
      detail: "Shared building blocks, open by default: data models and schemas, flexibility and grid-interaction methods, common KPIs and verification rules, validation tests, benchmark datasets, reference architecture, model contracts for buyers."
      value: "Value: any tool or study built on them can be compared, reused and trusted. Members keep their proprietary products."
    - title: "Facilitation"
      tagline: "A neutral table where the actors a project depends on sit down together."
      detail: "A trusted intermediary that convenes the people a local energy project needs: neighbours and community groups, the city, the utility or grid operator, financiers, developers, engineers and lawyers. It runs workshops, maps each party's problems and constraints, agrees the rules of the game (roles, confidentiality, data), coordinates working groups and documents the result. It does not design the project or sell engineering; members' experts contribute the advice."
      value: "Value: projects that would stall between planning and implementation get a shared diagnosis and an agreed way forward, and each organisation sees the others' barriers without giving up its own business. We already do this: see the next chapter."
    - title: "Pipeline"
      tagline: "A way to turn ideas into funded projects, with the right partners."
      detail: "A proposal desk that watches calls, matches partners, offers consortium templates and a rotation rule so competing centres can cooperate. Shared deliverable and reporting templates."
      value: "Value: more and better bids, shared writing cost, and a recognised route into EU, national and international programmes. The Alliance facilitates; it does not pick winners."
    - title: "Voice"
      tagline: "One credible, evidence-based voice towards EU, IEA, OECD and city networks."
      detail: "Evidence-based positions and joint statements towards the European Commission, the IEA, the OECD and city networks, transparent and approved by members."
      value: "Value: one counterpart for institutions, and local energy systems and digital twins recognised in funding and policy."
  note: "The commons starts where the literature is strongest: shared data models, flexibility and grid-interaction methods, common KPIs and validation. These are examples, not the whole proposal."

demo:
  kicker: "What a shared method gives you"
  title: "The same community, three futures for the local grid."
  lead: "Flexible heat pumps and batteries can relieve a congested feeder, or create a new peak if everyone reacts to the same cheap hours. A shared method lets a community and its grid operator test this before investing."
  tabs: {base: "Today", uncoordinated: "Uncoordinated flexibility", coordinated: "Coordinated flexibility"}
  labels: {peak: "peak load", hours: "hours above grid limit", limit: "Feeder limit", unit: "kW"}
  verdicts:
    base: "Evening peak breaks the limit."
    uncoordinated: "Everyone reacts to the same signal: a new peak at night."
    coordinated: "Coordinated: no hour above the limit."
  note: "Illustration. Hypothetical community and numbers, 24 hours. Profile and scenarios are in numbers.yaml > feeder."

form:
  kicker: "Why an alliance"
  title: "Compared with the alternatives, a member-owned alliance fills the gap."
  lead: "We are not replacing anything. The IEA Annex is the first engine, the Alliance is its permanent, wider home. Highlight a requirement you care about."
  requirements: ["Permanence", "Non-government members", "Fees and contracts", "Speed to start"]
  col_option: "Option"
  col_weakness: "Main weakness"
  scale: {y: "Yes", p: "Partly", n: "No"}
  # values per requirement: y = yes, p = partly, n = no
  options:
    - {name: "Alliance (member-owned association)", highlight: true, values: [y, y, y, p], weakness: "Slow to build credibility"}
    - {name: "IEA Annex only",           values: [p, n, n, n], weakness: "Government members only; no fees or contracts"}
    - {name: "Foundation",               values: [y, y, p, n], weakness: "Notary, endowment and higher cost"}
    - {name: "Project consortium only",  values: [n, y, n, y], weakness: "Ends when funding ends"}
    - {name: "Vendor platform",          values: [p, n, n, y], weakness: "Not neutral; members become customers"}
  note: "Assessment is our reading and open to challenge. IEA programmes are agreements between governments and have no legal personality of their own."

members:
  kicker: "Who takes part, and what they get"
  title: "Five kinds of members, each with a clear reason to join."
  bring_label: "What you bring"
  get_label: "What you get"
  roles:
    - {name: "Community networks", bring: "Reach to member communities, real needs, legitimacy, anonymised data.", get: "Free or low-cost tools and training, evidence for their policy work, stronger bids, a seat shaping the roadmap."}
    - {name: "Research centres", bring: "Methods, models, validation, students.", get: "Co-authored proposals, shared datasets, influence on standards, a safe way to cooperate with competitors."}
    - {name: "Cities and regions", bring: "Use cases, planning mandates, pilot sites, local data.", get: "Ready-to-use methods for local planning, a neutral facilitator for local planning questions, peer learning, access to funding consortia."}
    - {name: "Grid operators and utilities", bring: "Grid data under agreement, interfaces, co-funding, pilot access.", get: "Early view of standards, tested congestion and flexibility methods, a structured way to work with communities."}
    - {name: "Funders and institutions", bring: "Policy direction, grants, convening power.", get: "Evidence and validated methods, one counterpart for communities and twins, less duplication."}
  early_title: "Joining early"
  early_lead: "Early members fund the work before it is proven, so they would get a founders' package. The shape is still open:"
  early_cards:
    - {title: "Rate", text: "A reduced fee locked for several years."}
    - {title: "Seat", text: "A reserved role in the first board and technical committee."}
    - {title: "Credit", text: "Part of the fee returned as services such as training or proposal support."}
  note: "Fee levels are undecided and left blank on purpose. Umbrella networks would pay little or nothing in cash; their contribution is membership reach, validation and legitimacy."

irec_ask:
  kicker: "What's in it for IREC, and the ask"
  title: "A contained start, with access to funding, peers and real cases across the Atlantic."
  lead: "IREC would join with a small first commitment, space and some technical support, while Concordia carries the first-year salary. In return it gains reach that is harder to build alone."
  start_title: "A start with few requirements"
  start_text: "How the first two years are covered, according to the budget."
  start_cards:
    - {title: "Concordia carries the salary", text: "The alliance director is paid by Concordia in kind: {c27} EUR in {y0} and {c28} EUR in {y1}."}
    - {title: "IREC brings space and technical support", text: "In-kind rent of {i27} EUR in {y0} and {i28} EUR in {y1}, plus technical support (hours to be agreed). That is {p27}% and {p28}% of the costs."}
    - {title: "No cash commitment in the early years", text: "Partner contributions start in {y1} ({pc28} EUR in total across all partners). IREC's share is to be agreed, and could stay in kind."}
  benefits_title: "What IREC gains"
  benefits:
    - title: "More financing lines"
      text: "Concordia and North American partners can reach philanthropic foundations (for example Rockefeller or Schmidt) and international bodies (UN-Habitat, OECD); the Annex proposal already names UN-Habitat and the OECD as proposed collaborators. Access through the Alliance is our understanding, to be confirmed; nothing is committed. The budget aims at bilateral research projects ({bil} EUR over the period), a Horizon project ({hor} EUR) and multilateral calls such as IEA, World Bank and UN ({mul} EUR). Canada and Spain have also opened bilateral EUREKA calls through NRC-IRAP and CDTI (2020 and 2022; we found none open for 2025-2026)."
    - title: "Allied centres building similar tools"
      text: "Direct discussion with teams whose tools are stronger in specific aspects: Tools4Cities (open-source city digital twin framework with a REST API), REScoopVPP (open-source home gateway and community cloud for flexibility) and MAKING-PEDs (digital twins, with El Prat in Catalonia as a testbed). IREC brings its own community tools (comunitatenergetica.cat, SomComunitatEnergetica.cat). A shared data structure would make exchanging methods and integrating tools much easier."
    - title: "Use cases in other places"
      text: "Test and validate IREC's methods on cases elsewhere: Greater Montreal (solar, geothermal and waste-heat assessment), the Carre Laval living lab, Toronto district energy, Indigenous communities in BC and Alberta; and across Spain and Europe, Osona (27 communities in development), Gipuzkoa (60 in operation) and La Bordeta in Barcelona. Comparable case records turn each into evidence."
    - title: "Bridges for Catalonia"
      text: "Catalonia and Quebec have had a cooperation agreement since 1996 (30 years in 2026), with a joint committee that sets a work programme every two years; climate was added in 2010 and research and innovation, including clean energy, are priorities. Idea to explore: ask for community energy and digital twins to be reflected in the next programme. Beyond that, a Canada-Spain-Europe axis connects IREC to REScoop.eu, Energy Cities and the IEA route."
  we_ask_title: "What we ask of IREC"
  we_ask:
    - "Working space in Barcelona for the alliance team (in kind, as in the budget)."
    - "A technical contact and an agreed, limited amount of technical support."
    - "A place in the founding group: a seat on the board and the technical committee."
    - "One call to prepare together within the first year."
    - "A first review, with IREC's own tools, of the shared data structure."
  could_ask_title: "What IREC could ask for"
  could_ask:
    - "Clear rules on intellectual property and data sharing; IREC's own tools keep their identity."
    - "A limit on time and technical support, with a review point after the first year."
    - "How partner contributions are shared from the second year, and the option to contribute in kind."
    - "An exit clause and no exclusivity."
  questions_title: "Four questions for IREC"
  questions:
    - {tag: "Value", title: "Which of the four gains matters most to IREC?", text: "Funding lines, peers, use cases, or the Catalonia-Quebec bridge? Which would you drop?"}
    - {tag: "Support", title: "What could IREC realistically offer?", text: "Space, technical hours, data, a place for visiting researchers?"}
    - {tag: "Decision", title: "Who at IREC should be the contact and decide?", text: "And what approval would a first commitment need?"}
    - {tag: "Adoption", title: "What would stop IREC from joining?", text: "Resources, intellectual property, priorities, competition with own services? Tell us what the first step would need to look like."}
  note: "Figures come from the budget. Access to foundations and the Catalonia-Quebec idea are not commitments; they are routes to explore together."

