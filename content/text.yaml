  lead: "Five concrete goals for the five years after launch. They are proposals to discuss with members, and each can be measured."
  goals:
    - {stat: "500", title: "Communities assessed worldwide", text: "Each one described with the same clear indicators: cost, business model, up-to-date consumption and production, number of customers, governance model and social impact. All shown on a world map, with a clear, detailed fact sheet for every community."}
    - {stat: "1", title: "Common, up-to-date database", text: "One interoperable database, updated frequently, with the consumption and production of all communities and the difference from the reference case."}
    - {stat: "⇄", title: "Tools used across countries", text: "Tools shared between energy communities in different countries, that have helped them raise their productivity."}
    - {stat: "3", title: "Active research projects", text: "Each running between four or more members of the Alliance."}
    - {stat: "3+", title: "White papers and reference guides", text: "On energy communities at international level, promoted by the Alliance."}
  map_title: "The map: every community, one clear fact sheet"
