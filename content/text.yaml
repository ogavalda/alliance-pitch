lessons:
  kicker: "Lessons from other initiatives"
  title: "What earlier projects already taught us."
  lead: "Energy sharing, aggregation and community monitoring have been tried in many places. The same lessons come back. They shape what the Alliance should and should not do."
  evidence: "Evidence"
  implication: "For the Alliance"
  items:
    - title: "Scaling is harder than technology"
      text: "Local trading and sharing platforms worked in pilots. Growing them hit regulation, billing and member engagement before it hit technology."
      evidence: "Reviews of peer-to-peer platforms; Brooklyn Microgrid's main early difficulty was selling energy through a utility bill without being regulated as a utility."
      implication: "Share regulatory and billing know-how between members, not only code."
    - title: "Flexibility income alone rarely pays"
      text: "Revenue from shifting or shaving load is small next to the effort. It works when it sits inside a wider business case."
      evidence: "Project LEO (Oxfordshire, 2019 to 2023) concluded that flexibility income must be part of a broader case."
      implication: "Position aggregation tools as one service among several, and compare business cases with the same indicators."
    - title: "Data standards come first"
      text: "Standardisation, automation and investment in data were the main enablers. Without them every new community starts from zero."
      evidence: "Project LEO final report; Austrian smart-meter data access (market communication platform, EDDIE open source, ISEG interface, QODEC data quality)."
      implication: "This is the case for the shared core: ontology, data capture and provenance."
    - title: "Allocation rules are set by regulators and grid operators"
      text: "How energy is split between members depends on national rules and on the operator's willingness to apply them. Many countries are still on static coefficients."
      evidence: "Portugal: fixed, proportional, hierarchical and dynamic coefficients, with an approved pilot of dynamic ones. Spain: usually static coefficients and a 2 km radius. Germany: energy sharing legal from 1 June 2026, but no binding allocation-key rules yet and few operators offer building-level supply."
      implication: "Keep a comparative table of rules and of operator practice. It is cheap to maintain and valuable to every member."
    - title: "Residents need a story, not a tariff"
      text: "People respond to a clear reason and a trusted messenger. Repeat engagement with trading apps is weak."
      evidence: "Project LEO (learning how to talk to residents about flexibility); reviews of peer-to-peer platforms; H2020 social engagement lessons."
      implication: "This is where facilitation and the panel of experts add value that software does not."
    - title: "Benefits are rarely evaluated, and never the same way"
      text: "Few initiatives measure outcomes empirically, and those that do use different indicators, so results cannot be compared."
      evidence: "Reviews of peer-to-peer pilots; Canada's Smart Energy Communities Benchmark is a self-assessment of ten indicators for nine pilot municipalities; an academic 25-indicator set exists but is not widely used."
      implication: "Publish a minimal common indicator set and a case record, and ask members to report against it."
    - title: "Cooperatives are moving into aggregation"
      text: "Energy cooperatives are exploring the aggregator role to value their members' flexibility."
      evidence: "REScoopVPP (about EUR 4 million, 2020 to 2023, pilots in Belgium, France, Germany, Spain and the UK); Enercoop became a balance responsible party; Som Energia has studied becoming an aggregator."
      implication: "Aggregation is a member activity. The Alliance should document and compare it, not run it."
    - title: "Southern settings add logistics, security and capacity risks"
      text: "Projects in sub-Saharan Africa meet limits in logistics, security and local capacity that rarely show in northern case studies."
      evidence: "Azimut 360 and Aiguasol's description of their work in the region."
      implication: "Training and local partners are part of any technology transfer, not an afterthought."
    - title: "Intermediaries are what make local projects start"
      text: "A neutral convenor with enough authority to lead moves projects that stall between stakeholders."
      evidence: "Our own record: district heating at Laval and Concordia, ABC Accelerator, CÔTÉ (see the facilitation chapter)."
      implication: "Keep leadership of the process inside the offer, next to the tools."
  kpi_title: "A starting point for common indicators"
  kpi_lead: "To compare communities, the first step is to agree on a small shared set grouped like the published frameworks. This is a proposal for discussion, to be tested with members."
  kpi:
    - {title: "Energy", text: "Self-consumption, self-sufficiency, share of demand matched locally, peak demand and its reduction, flexibility delivered."}
    - {title: "Economic", text: "Cost per member, savings, revenue from sharing and flexibility, investment per kW, payback."}
    - {title: "Social", text: "Members, share of vulnerable households, participation and retention, governance indicators."}
    - {title: "Environmental", text: "Avoided emissions, local renewable share, and the method used to calculate them."}
    - {title: "Capacity (from the Canadian benchmark)", text: "Governance, staff, data, financing and strategy of the municipality or community."}
    - {title: "Data quality", text: "For each value: measured, modelled or declared; source; period; resolution."}
  gaps_title: "What we could not find"
  gaps:
    - "A verified percentage of peak reduction for a real energy community aggregation pilot; the sources found describe designs and targets."
    - "Documented allocation tools from Spanish cooperatives and Canadian pilots beyond the regulatory schemes; to be confirmed with members."
    - "The data models behind most of the tools above. Vendor claims in the tool table are marked as such and should be treated as unverified."
    - "The outcome of Brooklyn Microgrid after its pilot years."
  note: "Desk research, October 2026. Please correct and add initiatives; this list is meant to grow with members' own experience."

south:
  kicker: "Partners in the Global South"
  title: "A bridge to countries where microgrids and community energy are how people get electricity."
  lead: "In Europe and Canada, communities optimise an existing grid. In many countries of the Global South, microgrids and community-run systems are often the first access to electricity. The questions are close (sizing, data, indicators, governance, financing), so tools and lessons can travel in both directions. Azimut 360 would bring that experience."
  why_title: "Why it belongs in the Alliance"
  why:
    - {title: "Same questions, different starting point", text: "Planning, data capture, indicators and governance matter in both settings. A shared core that also fits off-grid and mini-grid cases is more robust."}
    - {title: "Lessons travel both ways", text: "Southern projects have long worked with local ownership, tight budgets and weak grids. Northern communities are now facing flexibility and resilience questions of the same kind."}
    - {title: "A broader funding base", text: "Development and climate funders support work that links North and South. A joint offer could reach lines that a purely European or Canadian one cannot (to be explored; nothing is committed)."}
  azimut_title: "What Azimut 360 brings"
  azimut_text: "A Catalan cooperative founded in 2009, part of the social and solidarity economy network, with engineering and implementation of solar PV projects in Spain and abroad."
  azimut:
    - {title: "Rural microgrids", text: "Strong specialisation in rural electrification with microgrids, including health and energy projects such as electricity for hospitals, schools and water."}
    - {title: "Sub-Saharan experience", text: "Work in countries such as Burkina Faso, Ivory Coast, Ghana, Mozambique, Uganda and Gambia, with first-hand knowledge of logistics, security and local capacity limits."}
    - {title: "Community and cooperative models", text: "Listed expertise in energy communities and cooperative models; a spin-off, Azimut O2, works on solar-powered medical oxygen."}
  azimut_note: "From public descriptions of Azimut 360, October 2026. To be confirmed and completed with Azimut."
  transfer_title: "Technology transfer and training"
  transfer_lead: "The two-way exchange rests on four things."
  transfer:
    - {title: "Open tools", text: "The shared core, validators and the case-record template are released open, so southern partners can use them without licences."}
    - {title: "Adaptation with local partners", text: "Versions for little data, off-grid and mini-grid systems and local languages, adapted by local universities and cooperatives."}
    - {title: "Training", text: "Courses and train-the-trainer material, so that skills stay in the region."}
    - {title: "A feedback loop", text: "What is learned in southern projects returns to the commons and improves the tools for everyone."}
  work_title: "What the work could be"
  work:
    - {title: "Extend the case record", text: "Describe southern microgrid and community cases with the same fields and indicators as northern ones, so that they can be compared."}
    - {title: "Adapt the shared core", text: "Check that the data structure, capture protocol and indicators also work for off-grid and mini-grid systems, and for contexts with little data."}
    - {title: "Peer learning North-South", text: "Exchange between cooperatives, cities and research centres on ownership models, tariffs, maintenance and community governance."}
    - {title: "Joint proposals", text: "Co-write proposals with southern partners and local universities, with the Alliance as convenor and the members as implementers."}
    - {title: "Capacity and training", text: "Training material and open tools reused in southern contexts, with local partners adapting them."}
