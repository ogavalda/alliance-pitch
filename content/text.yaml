meta:
  title: "Alliance for Digital Twins for Decarbonization: a draft proposal"
  description: "A draft proposal for a member-owned alliance that gives local energy actors a shared commons, a project pipeline and a common voice."
  version_line: "Draft v0.2 · October 2026"

