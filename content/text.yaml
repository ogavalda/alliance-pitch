ebc_annex:
  kicker: "The IEA EBC Annex proposal"
  title: "The Annex is the first engine: from \"can it work?\" to \"who will make it work?\""
  lead: "Proposed title: <em>Enabling implementation of Community Energy Solutions through digital platforms</em>. The concept was submitted to the IEA EBC Executive Committee in early October 2026, supported by NRCan. Proposed lead and Operating Agent: Ursula Eicker (Concordia University)."
  problem_title: "The problem it addresses"
  problem_text: "Community-scale energy systems (solar PV energy communities, district heating and cooling, mixed-energy districts and campuses) are technically mature, yet uptake is slow. Feasibility studies answer \"can this work?\" but rarely \"who will make this work?\", so sound projects stall between planning and implementation. The Annex uses digital twins for fast technical and financial assessment and treats governance, participation, ownership, financing and regulation as part of the model."
  objectives_title: "Six objectives"
  objectives:
    - {title: "Governance structures", text: "Identify successful stakeholder roles, ownership and operating structures, utility engagement, participation and risk allocation."}
    - {title: "The implementation gap", text: "Find out why feasible projects do not advance, and build frameworks for institutional barriers, coordination, procurement and acceptance."}
    - {title: "Financing", text: "Business models, public-private and utility partnerships, community ownership and risk-sharing."}
    - {title: "Regulation", text: "Compare frameworks for district energy, energy communities, electricity sharing, tariffs, building design and zoning."}
    - {title: "Digital planning tools", text: "Apply and scale open-source digital-twin tools for demand simulation, community energy mapping, technology screening and life-cycle cost, with regulatory, financing and governance constraints built in."}
    - {title: "Implementation roadmaps", text: "Step-by-step guidance for municipalities, developers and citizen organisations, from feasibility study to operation."}
  outputs_title: "Outputs"
  outputs: "A governance and stakeholder framework, a participation and co-creation framework, a financing and business-model guidebook, a regulatory assessment, implementation roadmaps, demonstration case studies and policy recommendations, all integrated in one digital platform that guides the whole planning process."
  lineage_title: "Builds on earlier EBC work"
  lineage: "Annex 51 (Energy Efficient Communities), Annex 63 (Implementation of Energy Strategies in Communities), Annex 73 (Net Zero Energy Resilient Public Communities), Annex 75 (Cost-effective Building Renovation at District Level) and Annex 83 (Positive Energy Districts). None of them combined fast digital feasibility assessment with the organisational delivery problem."
  plan_title: "Timeline and partners"
  plan_cards:
    - {title: "Duration", text: "Preparation 1 year, working phase 3 years, reporting 1 year. Start depends on the ExCo decision."}
    - {title: "Coordination", text: "With the DHC, Cities, SHC, Energy Storage and Users (DSM) Technology Collaboration Programmes."}
    - {title: "Outside collaborators proposed", text: "Municipal organisations such as FCM, the Global Covenant of Mayors, C40 and Transition Accelerator organisations, and international bodies such as UN-Habitat and the OECD's Cities, Urban Policies and Sustainable Development Division."}
  link_title: "How the Alliance relates to it"
  link_text: "The Annex is government-led and time-limited. The Alliance would be its permanent, wider home: it keeps the shared core, the tools and the partners alive after the Annex ends, and lets companies and community networks take part, which an Annex cannot do."
  note: "Source: EBC Project Concept dated 24 August 2026. Open item: a Technology Readiness Assessment has not been carried out yet; the ExCo would ask for it at the workshop that develops the full proposal."

ebc_summary:
  kicker: "The first engine"
  title: "A new IEA EBC Annex is already on the table, supported by NRCan."
  lead: "In early October 2026 we submitted a proposal to the IEA EBC Executive Committee for a new Annex: <em>Enabling implementation of Community Energy Solutions through digital platforms</em>. It moves the question from \"can this work?\" to \"who will make it work?\", using digital twins for fast feasibility and adding governance, financing and regulation to the model."
  cards:
    - {title: "What it does", text: "Governance models, financing, regulation and open-source digital-twin tools, brought together in one platform that guides a project from pre-feasibility to implementation."}
    - {title: "How long", text: "1 year of preparation, 3 of work and 1 of reporting, if the ExCo approves (decision expected at its November 2026 meeting)."}
    - {title: "Why an Alliance too", text: "An Annex is government-led and ends. The Alliance keeps the shared core, tools and partners alive afterwards, and lets companies and community networks take part."}
  note: "Proposed lead and Operating Agent: Ursula Eicker (Concordia). Proposed outside collaborators include FCM, the Global Covenant of Mayors, C40, UN-Habitat and the OECD."

services:
  kicker: "What the Alliance offers outside its members"
  title: "Services that help everyone and compete with no one."
  lead: "The test is simple: the Alliance does what no single member has a reason to do alone, and never delivers work a member could sell. Anything touching a client's own project, a specific site or a commercial product is out."
  first_title: "Start with four"
  first:
    - {title: "A white paper", text: "An annual state of local energy and digital twins: evidence across projects, how indicators are defined, a map of tools and gaps. Cheap, builds credibility and gives the Alliance its voice."}
    - {title: "Case-record and indicator standard", text: "A common record for community and district case studies, with agreed indicator definitions and reference calculations, so cases can be compared like with like."}
    - {title: "Proposal desk", text: "Watches calls, matches partners, offers consortium and reporting templates and a rotation rule. It does not write bids or pick winners."}
    - {title: "Facilitated processes", text: "A neutral convener runs a multi-stakeholder process around one concrete project or place: workshops, shared diagnosis, working groups, documented outcome. We already do this (see the facilitation chapter). It takes more effort, so it starts with a few pilot processes."}
  first_note: "The first three are cheap, show value within a year, and none touches a member's own business. Facilitation is the Alliance's signature activity and needs a funded coordinator."
  later_title: "Once trust exists"
  later:
    - {title: "Benchmarking and validation", text: "Run members' models against shared test datasets and publish the results. A neutral referee, not a consultant."}
    - {title: "Procurement support", text: "Model contract clauses and a checklist for cities buying digital twins, so buyers can ask for interoperability."}
  scope_title: "In scope and out of scope"
  col_in: "In scope: infrastructure and neutral services"
  col_out: "Out of scope: what members do"
  scope:
    - ["Convening and facilitating multi-stakeholder processes around a concrete project", "Designing the project, selling engineering or taking a role in its delivery"]
    - ["Data model, ontology and a validator that checks conformity", "Platforms or interfaces for managing a community or serving end users"]
    - ["Case-record template and an open library of cases", "Studies or designs for a specific client, site or project"]
    - ["Indicator definitions with reference calculations", "Proprietary algorithms or products sold to communities"]
    - ["Mapping tool that converts a member's data to the shared structure", "Operating a member's data or platform"]
    - ["White papers, benchmarks, training and forums", "Consulting and bid writing for individual members"]
    - ["Model contracts and procurement checklists", "Selecting vendors or winners"]
    - ["Hosting anonymised datasets members agree to share", "Competing with members' own services"]
  paid_title: "What could be paid for"
  paid_yes_title: "Neutral paid services"
  paid_yes: ["Training and courses", "Participation in benchmarks", "Certification against the shared core", "Coordination of a facilitated process, at cost (to be discussed)"]
  paid_no_title: "Not offered"
  paid_no: ["Anything that looks like consulting"]
  note: "Our proposal, open to discussion. Members' views on the line between neutral and competing are one of the questions we need critique on."

facilitation:
  kicker: "Already doing it"
  title: "Bringing people to the table is something we already do."
  lead: "Our centre has played the intermediary in two district heating initiatives and has started two projects that bring the stakeholders of a sector together. We would make this one of the Alliance's essential activities, with more partners and at a larger scale."
  cards:
    - {title: "District heating at Laval and at Concordia", text: "We acted as the intermediary between the partners, running workshops and working out the different problems of the neighbours."}
    - {title: "ABC Accelerator (Montréal, since 2022)", text: "A \"sustainability SWAT team\" of the city, a utility, a bank, developers, engineers, architects, lawyers and the university works on real projects. Two pilots, over 200 hours each, a three-month process."}
    - {title: "CÔTÉ Habitat (Montréal)", text: "A centre that brings together a housing network, a transition alliance and Concordia around the transition of existing housing: technical, social, urban and financial support in one process. Under development, looking for a salaried lead."}
    - {title: "What we learned", text: "A university as neutral convener builds trust. A concrete project beats an abstract debate. With the whole chain at one table, barriers become opportunities. It takes three to four months and a funded coordinator."}
  note: "Method, lessons and the line with what members do are in the annex."

facilitation_detail:
  kicker: "Facilitation: method and track record"
  title: "How the Alliance would run a facilitated process."
  lead: "Local energy projects rarely fail because the technology does not work. They stall because the city, the utility, the financier, the developer and the neighbours have never worked out together who does what. A neutral convener closes that gap."
  record_title: "Track record"
  record:
    - {title: "District heating at Laval and at Concordia", text: "Our centre played the intermediary between the partners, ran workshops and worked out the different problems of the neighbours."}
    - {title: "ABC Accelerator", text: "Started in 2022 within the Montréal climate partnership. A \"sustainability SWAT team\" of seven kinds of actors: university, developer, financing, utility, engineering and architecture, law and the city. First test with two real developers."}
    - {title: "CÔTÉ Habitat", text: "A centre for the ecological transition of existing housing in Montréal, led by a housing network, a transition alliance and Concordia. Technical, social, urban and financial support in one process; two pilots planned to test the assumptions and the business models."}
  abc_title: "The ABC Accelerator in numbers"
  abc_stats:
    - {value: "7", label: "kinds of actors at one table"}
    - {value: "2", label: "pilot projects with real developers"}
    - {value: "200+", label: "expert hours per project, plus about 400 hours to build reusable tools"}
    - {value: "3 months", label: "per project, ending in four documents"}
  abc_note: "Estimated emission reductions for the two pilots: about 19% with the baseline proposals and 33% with the next-generation proposals (the project's own estimates, not measured results)."
  method_title: "A process in six steps"
  method:
    - {title: "Start from a concrete project", text: "A real project or place, not an abstract topic."}
    - {title: "Invite the whole chain", text: "City, utility, financier, developer, engineers and architects, legal advice, and the community or neighbours."}
    - {title: "Agree the rules first", text: "Roles, confidentiality, what can be shared, and a fair way to select who takes part."}
    - {title: "Listen and map", text: "Workshops to understand each party's problems and constraints, and who is most and least open to change."}
    - {title: "Work in small commissions", text: "For example public space, energy systems, buildings and certification, with a monthly plenary."}
    - {title: "Document and hand back", text: "A diagnosis, proposals at two levels of ambition, ways to fund them and recommendations with costs and impacts, plus templates others can reuse."}
  lessons_title: "What we learned"
  lessons:
    - "A university acting as a central, neutral agent is seen very positively and builds trust."
    - "Innovative options scare people less when banks, municipalities and key actors visibly back them."
    - "Examples from others, and a good pitch, speed up decisions."
    - "Technical teams can start as the conservative force. Meeting after meeting, with their fears addressed, they became collaborative."
    - "Three to four months of process help to smooth the first doubts."
    - "Confidentiality worries come first: a non-disclosure agreement with the convener and side agreements with each partner were needed."
    - "Free expert time does not allow deep dedication. The coordination needs funding: CÔTÉ plans a salaried lead from the start."
  scope_title: "The line with what members do"
  scope_in_title: "The Alliance does"
  scope_in: ["Convene, run workshops and facilitate", "Map problems and agree the rules", "Coordinate working groups and document the result", "Turn what is learned into templates and tools open to all"]
  scope_out_title: "The Alliance does not"
  scope_out: ["Design the project or sell engineering", "Take a commercial role in delivery", "Choose vendors or winners", "Replace the expertise members bring to the table"]
  link_title: "How it connects to the rest"
  link_text: "Each process produces a real case for the shared case-record standard, evidence for the white paper and the Annex's governance work, and a pipeline of projects that are ready to be funded."
  note: "Sources: draft chapter on the ABC Accelerator (2024) and the CÔTÉ Habitat two-pager. Partner organisations are not named here on purpose. Results are estimates."
