# All numbers and chart inputs. Colours follow the Concordia template (burgundy 93002D, pink E90065, blue 1598D6, green 00776F, orange E83F21).
# (kept as one comment line). Edit values, re-run: python build.py

palette:                       # colours used by the charts (Concordia template)
  networks:  "#1598d6"
  cities:    "#e83f21"
  grid:      "#e90065"
  dhc:       "#e08a00"
  research:  "#93002d"
  funders:   "#00776f"
  teal:      "#93002d"
  alert:     "#e90065"
  ok:        "#1598d6"
  engaged:   "#e90065"

# ---- Section "why": the three headline statistics (text for each is in text.yaml)
stats:
  policy: "9 → 90 GW"
  scale:  "8,000+"
  twins:  "Twins"

# ---- Chart 1: network illustration (hero)
# Each node: x, y (in a 900 x 300 canvas) and actor type (must match a palette key)
network:
  # Real organisations from the stakeholder map (examples; listing implies no participation).
  # label, scope (Canada / International / Spain), type (palette key), x, y in a 1000 x 480 canvas, engaged: true = pink ring
  hub: {x: 500, y: 232, radius: 44}
  neighbours: 2                # each node is linked to this many nearest nodes when 'connected'
  scopes:                      # faint cluster titles: label, x
    - {label: CANADA, x: 150}
    - {label: INTERNATIONAL, x: 500}
    - {label: SPAIN, x: 850}
  nodes:
    - {label: "CECC", scope: Canada, type: networks, x: 70, y: 70}
    - {label: "OSEA", scope: Canada, type: networks, x: 200, y: 52}
    - {label: "QUEST Canada", scope: Canada, type: cities, x: 80, y: 190}
    - {label: "FCM Green Municipal Fund", scope: Canada, type: cities, x: 215, y: 175}
    - {label: "Concordia NGCI", scope: Canada, type: research, x: 70, y: 320, engaged: true}
    - {label: "Enwave", scope: Canada, type: dhc, x: 215, y: 305}
    - {label: "NRCan", scope: Canada, type: funders, x: 145, y: 420}
    - {label: "REScoop.eu", scope: International, type: networks, x: 385, y: 62}
    - {label: "Energy Cities", scope: International, type: cities, x: 500, y: 48}
    - {label: "European Commission", scope: International, type: funders, x: 620, y: 62}
    - {label: "IEA EBC and DHC", scope: International, type: research, x: 395, y: 395}
    - {label: "Euroheat & Power", scope: International, type: dhc, x: 520, y: 410}
    - {label: "EU DSO Entity", scope: International, type: grid, x: 640, y: 395}
    - {label: "Som Energia", scope: Spain, type: networks, x: 775, y: 62}
    - {label: "OECoop", scope: Spain, type: networks, x: 905, y: 85}
    - {label: "Unión Renovables", scope: Spain, type: networks, x: 800, y: 155}
    - {label: "ADHAC", scope: Spain, type: dhc, x: 925, y: 180}
    - {label: "IREC", scope: Spain, type: research, x: 785, y: 265, engaged: true}
    - {label: "Aiguasol", scope: Spain, type: research, x: 915, y: 280, engaged: true}
    - {label: "Districlima", scope: Spain, type: dhc, x: 790, y: 360}
    - {label: "i-DE", scope: Spain, type: grid, x: 915, y: 385}
    - {label: "IDAE", scope: Spain, type: funders, x: 800, y: 445}
    - {label: "ICAEN", scope: Spain, type: funders, x: 925, y: 448}

# ---- Chart 3: feeder load (optional section "demo")
feeder:
  limit_kw: 100
  y_max: 140
  base_profile_kw: [40,36,34,33,34,40,58,80,86,70,62,60,62,60,58,62,74,98,112,106,92,78,60,48]   # 24 hourly values
  # Changes applied to the base profile, in kW, for each scenario. hours = [first, last] inclusive.
  uncoordinated:
    - {hours: [3, 5],   delta: 38}
    - {hours: [12, 13], delta: 8}
    - {hours: [17, 20], delta: -24}
  coordinated:
    - {hours: [1, 5],   delta: 14}
    - {hours: [11, 15], delta: 6}
    - {hours: [17, 20], delta: -24}
    - {hours: [22, 23], delta: 8}
